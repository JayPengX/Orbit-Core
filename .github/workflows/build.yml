# A builder's job run now (by hand): the family's data (builders/run.js),
# through the proxy's POST /data/build with the push secret. For checking a
# builder without waiting for its minute or its hour. Or a check of the
# proxy (POST /ops): gemini-check, one tiny Gemini call through the Taiwan
# relay; system, the report the admin panel's 系統 shows.
name: Run a builder or a check
on:
  workflow_dispatch:
    inputs:
      job:
        description: The job
        type: choice
        options: [watch, watch-full, cutouts, buses, play, asia, cpbl, sports, photos, winprob, kept, kept-dry, f1kept, f1kept-count, gemini-check, law-chat-time, system, purge-money-mail]
        default: watch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run it
        run: |
          base=https://orbit-workers-proxy.pengzjay.workers.dev
          case "$JOB" in
            gemini-check) url="$base/ops?check=gemini" ;;
            law-chat-time) url="$base/ops?check=law-chat" ;;
            system) url="$base/ops?check=system" ;;
            purge-money-mail) url="$base/ops?check=purge-money-mail" ;;
            watch-full) url="$base/data/build?job=watch&full=1" ;;
            watch|cutouts|buses) url="$base/data/build?job=$JOB" ;;
            *) url="$base/data/build?only=$JOB" ;;
          esac
          curl -sS --max-time 900 -X POST -H "Authorization: Bearer $DATA_PUSH_SECRET" "$url"; echo
        env:
          JOB: ${{ inputs.job }}
          DATA_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET }}
