# A builder's job run now (by hand): the family's data (builders/run.js),
# through the proxy's POST /data/build with the push secret. For checking a
# builder without waiting for its minute or its hour. Or a check of the
# proxy (POST /ops): gemini-check, one tiny Gemini call through the Taiwan
# relay; system, the report the admin panel's 系統 shows; capacity, its 容量;
# sources, its 外部來源 (the proxy's and the phones' counts); sources-state,
# the panel's own verdict (what's red or amber, and why).
name: Run a builder or a check
on:
  workflow_dispatch:
    inputs:
      job:
        description: The job
        type: choice
        options: [watch, watch-full, cutouts, buses, asia, cpbl, sports, photos, winprob, kept, kept-dry, f1kept, f1kept-count, news, markets, gemini-check, gemini-use, ai-money, law-chat-time, ai-models, ai-compare, ai-try, as-phone, ai, ai-news, ai-sports, ai-preview, ai-f1, ai-sides, ai-words, system, levels, capacity, detail, cpu, sources, sources-state, store-time]
        default: watch
      try:
        description: "law-chat-time: settings to try, e.g. answer=minimal,plan=minimal,model=lite; gemini-check: a model name; ai-money: set=anthropic:5,openai:3 (balances, US$); ai-compare: models=a,b&from=0&n=3; cpu: query, e.g. hours=24&group=…&keys=1&script=…; as-phone: path=/ai&app=money&body=<base64 JSON>; sources: ids, e.g. tnn-bus,txg-bus; levels: dry=1 to count only"
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run it
        run: |
          base=https://orbit-workers-proxy.pengzjay.workers.dev
          case "$JOB" in
            gemini-check) url="$base/ops?check=gemini&model=$TRY" ;;
            gemini-use) url="$base/ops?check=gemini-use&$TRY" ;;
            ai-money) url="$base/ops?check=ai-money&$TRY" ;;
            law-chat-time) url="$base/ops?check=law-chat&try=$TRY" ;;
            ai-models) url="$base/ops?check=ai-models" ;;
            ai-compare) url="$base/ops?check=ai-compare&$TRY" ;;
            ai-try) url="$base/ops?check=ai-try&$TRY" ;;
            store-time) url="$base/ops?check=store-time" ;;
            as-phone) url="$base/ops?check=as-phone&$TRY" ;;
            system) url="$base/ops?check=system" ;;
            levels) url="$base/ops?check=levels&$TRY" ;;
            capacity) url="$base/ops?check=capacity" ;;
            cpu) url="$base/ops?check=cpu&$TRY" ;;
            detail) url="$base/ops?check=detail" ;;
            sources) url="$base/ops?check=sources&src=$TRY" ;;
            sources-state) url="$base/ops?check=sources-state" ;;
            watch-full) url="$base/data/build?job=watch&full=1" ;;
            watch|cutouts|buses) url="$base/data/build?job=$JOB" ;;
            *) url="$base/data/build?only=$JOB" ;;
          esac
          curl -sS --max-time 900 -X POST -H "Authorization: Bearer $DATA_PUSH_SECRET" "$url"; echo
        env:
          JOB: ${{ inputs.job }}
          TRY: ${{ inputs.try }}
          DATA_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET }}
