# A Worker's live logs for a few minutes (Run workflow, by hand): what a cron
# or a request printed, without signing in to Cloudflare; or (cpu) where its
# CPU goes, by route, cron and caller (country, colo, network), and who calls
# over 7 days (the Workers Logs). Read-only.
name: Tail a Worker
on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which Worker
        type: choice
        options: [quota-guard, orbit-workers-proxy, gemini-relay]
        default: quota-guard
      minutes:
        description: How long to listen (1-15)
        default: '6'
      cpu:
        description: Instead of the logs, each route's and cron's count and CPU (ms) summed
        type: boolean
        default: false
      find:
        description: "(cpu) Who called addresses holding this, 7 days, e.g. /transit/drive"
        default: ''
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Every Worker in the account and its crons; the account's plans
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for w in $(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result||[]).map(x=>x.id).join(" "));if(!j.success)console.error(JSON.stringify(j.errors))})'); do
            printf '%s: ' "$w"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts/$w/schedules" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result?.schedules||[]).map(x=>x.cron).join(" | ")||"none")})'
          done
          echo "== subscriptions"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/subscriptions" | head -c 1500; echo
          echo "== workers account settings"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/account-settings" | head -c 600; echo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Each Worker's crons and address, as Cloudflare has them
        run: |
          for w in quota-guard orbit-workers-proxy gemini-relay; do
            echo "== $w"
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w/schedules" | head -c 600; echo
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w/subdomain" | head -c 300; echo
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # (cpu only) The last 7 days by where Cloudflare answered: phones in Taiwan
      # come through its colos there, our own tools (cloud machines abroad) and
      # crons elsewhere. The dimensions the dataset has are listed first.
      - name: The last 7 days by colo
        if: inputs.cpu
        # (A slip in this report never fails the run: a failed run mails Jay.)
        continue-on-error: true
        run: |
          node -e '
            const q = (query, variables = {}) => fetch("https://api.cloudflare.com/client/v4/graphql", { method: "POST", headers: { Authorization: `Bearer ${process.env.CF_GUARD_TOKEN}`, "Content-Type": "application/json" }, body: JSON.stringify({ query, variables }) }).then(r => r.json());
            (async () => {
              const s = await q("{ __schema { types { name fields { name } } } }");
              const dims = (s.data?.__schema?.types || []).filter(t => /^AccountWorkersInvocationsAdaptive.*Dimensions$/.test(t.name));
              for (const t of dims) console.log(t.name + ":", (t.fields || []).map(f => f.name).join(" "));
              if (!dims.length) console.log("introspection:", JSON.stringify(s).slice(0, 400));
              const has = new Set(dims.flatMap(t => (t.fields || []).map(f => f.name)));
              const by = has.has("coloCode") ? "coloCode" : has.has("colo") ? "colo" : null;
              if (!by) return console.log("no colo dimension");
              const end = Math.floor(Date.now() / 3_600_000) * 3_600_000;
              const iso = t => new Date(t).toISOString().replace(/\.\d+Z$/, "Z");
              const r = await q(`query($a: string!, $s: Time!, $e: Time!) { viewer { accounts(filter: { accountTag: $a }) { x: workersInvocationsAdaptive(limit: 10000, filter: { datetime_geq: $s, datetime_leq: $e }) { sum { requests cpuTimeUs } dimensions { ${by} scriptName date eventType } } } } }`, { a: process.env.CLOUDFLARE_ACCOUNT_ID, s: iso(end - 7 * 86_400_000), e: iso(end - 1000) });
              if (r.errors) console.log("errors:", JSON.stringify(r.errors).slice(0, 600));
              const rows = r.data?.viewer?.accounts?.[0]?.x || [];
              const sum = (key, pick) => { const m = {}; for (const x of rows) { const k = pick(x.dimensions); const v = (m[k] ||= { n: 0, cpu: 0 }); v.n += x.sum.requests; v.cpu += x.sum.cpuTimeUs / 1000; } return Object.entries(m).sort((a, b) => b[1].cpu - a[1].cpu); };
              const all = rows.reduce((t, x) => t + x.sum.cpuTimeUs / 1000, 0);
              console.log(`7 days: ${rows.reduce((t, x) => t + x.sum.requests, 0)} requests, ${Math.round(all)} cpu ms`);
              console.log("== by colo (cpu ms, requests, share of cpu)");
              for (const [k, v] of sum(by, d => d[by])) console.log(String(Math.round(v.cpu)).padStart(10), String(v.n).padStart(9), (v.cpu / all * 100).toFixed(1).padStart(6) + "%", k);
              console.log("== by colo and Worker");
              for (const [k, v] of sum(by, d => `${d[by]} ${d.scriptName}`).slice(0, 40)) console.log(String(Math.round(v.cpu)).padStart(10), String(v.n).padStart(9), k);
              // (Where phones in Taiwan come in: its own colos and the nearby ones.)
              const NEAR = new Set(["TPE", "KHH", "RMQ", "HKG", "MFM", "NRT", "KIX", "FUK", "OKA", "ICN", "PUS", "SIN", "KUL", "BKK", "MNL", "CGK", "SGN", "HAN"]);
              const side = d => `${d.eventType} ${NEAR.has(d[by]) ? "near Taiwan" : "elsewhere"}`;
              console.log("== by kind and place (cpu ms, requests, share of cpu)");
              for (const [k, v] of sum(by, side)) console.log(String(Math.round(v.cpu)).padStart(10), String(v.n).padStart(9), (v.cpu / all * 100).toFixed(1).padStart(6) + "%", k);
              console.log("== by day, kind and place");
              const dk = {}; for (const x of rows) { const k = `${x.dimensions.date} ${side(x.dimensions)}`; const v = (dk[k] ||= { n: 0, cpu: 0 }); v.n += x.sum.requests; v.cpu += x.sum.cpuTimeUs / 1000; }
              for (const k of Object.keys(dk).sort()) console.log(k.padEnd(36), String(Math.round(dk[k].cpu)).padStart(9), "ms", String(dk[k].n).padStart(7));
              console.log("== near Taiwan by colo and kind");
              for (const [k, v] of sum(by, d => `${d[by]} ${d.eventType} ${d.scriptName}`).filter(([k]) => NEAR.has(k.split(" ")[0]))) console.log(String(Math.round(v.cpu)).padStart(10), String(v.n).padStart(9), k);
              console.log("== by day and colo (top 3 a day)");
              const days = {}; for (const x of rows) { const d = x.dimensions.date; const k = x.dimensions[by]; ((days[d] ||= {})[k] ||= { n: 0, cpu: 0 }); days[d][k].n += x.sum.requests; days[d][k].cpu += x.sum.cpuTimeUs / 1000; }
              for (const d of Object.keys(days).sort()) console.log(d, Object.entries(days[d]).sort((a, b) => b[1].cpu - a[1].cpu).slice(0, 3).map(([k, v]) => `${k} ${Math.round(v.cpu)} ms/${v.n}`).join(" · "), "· all", Math.round(Object.values(days[d]).reduce((t, v) => t + v.cpu, 0)));
            })().catch(e => console.log("failed:", e.message));'
        env:
          CF_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN }}
      # (cpu only) Who calls, from the Workers Logs (the proxy's sampled
      # invocations, 7 days, scaled to the whole): an app's page (a host on the
      # family's domain, orbit.<domain> or <domain>, at /api/…) or anything else
      # (our tools on api.<domain> or workers.dev, the checks), in any country.
      # Needs Workers Observability Edit on the guard's token (guard.js
      # pageShare reads the same for the panel's 容量).
      - name: Who calls, from the Workers Logs
        if: inputs.cpu
        continue-on-error: true
        run: |
          node -e '
            const api = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query`;
            const timeframe = { from: Date.now() - 7 * 86_400_000, to: Date.now() };
            const ask = async (filters, by) => {
              const r = await fetch(api, { method: "POST", headers: { Authorization: `Bearer ${process.env.CF_GUARD_TOKEN}`, "Content-Type": "application/json" }, body: JSON.stringify({ queryId: "orbit-who-calls", timeframe, view: "calculations", limit: 30, parameters: { calculations: [{ operator: "sum", key: "$workers.cpuTimeMs", keyType: "number", alias: "cpu" }], filters, groupBys: by.map(value => ({ type: "string", value })), limit: 30, orderBy: { value: "cpu", order: "desc" } } }) });
              const j = await r.json().catch(() => ({}));
              if (!j.success) return console.log("  failed:", r.status, JSON.stringify(j.errors || j).slice(0, 300));
              const rows = j.result?.calculations?.[0]?.aggregates || [];
              const all = rows.reduce((t, x) => t + (x.value || 0), 0);
              for (const x of rows) console.log(String(Math.round((x.value || 0) / 7)).padStart(9), "ms/day", String(Math.round((x.count || 0) / 7)).padStart(7), "a day", String(Math.round((100 * (x.value || 0)) / (all || 1))).padStart(3) + "%", (x.groups || []).map(g => g.value).join(" · ") || "(all)");
            };
            const proxy = { key: "$workers.scriptName", operation: "eq", type: "string", value: "orbit-workers-proxy" };
            const host = h => ({ key: "$workers.event.request.headers.host", operation: "eq", type: "string", value: h });
            const notHost = h => ({ key: "$workers.event.request.headers.host", operation: "neq", type: "string", value: h });
            const domain = process.env.DOMAIN;
            (async () => {
              console.log("== every Worker, by kind"); await ask([], ["$workers.scriptName", "$workers.eventType"]);
              console.log("== the proxy, by host"); await ask([proxy], ["$workers.event.request.headers.host"]);
              console.log(`== pages (orbit.${domain}), by country`); await ask([proxy, host(`orbit.${domain}`)], ["$workers.event.request.cf.country"]);
              console.log("== not pages, by network"); await ask([proxy, notHost(`orbit.${domain}`), notHost(domain)], ["$workers.event.request.cf.asOrganization"]);
              console.log("== not pages, by host and country"); await ask([proxy, notHost(`orbit.${domain}`), notHost(domain)], ["$workers.event.request.headers.host", "$workers.event.request.cf.country"]);
              const find = process.env.FIND;
              if (find) {
                const has = { key: "$workers.event.request.url", operation: "includes", type: "string", value: find };
                console.log(`== ${find}: by host and origin`); await ask([proxy, has], ["$workers.event.request.headers.host", "$workers.event.request.headers.origin"]);
                console.log(`== ${find}: by host and network`); await ask([proxy, has], ["$workers.event.request.headers.host", "$workers.event.request.cf.asOrganization"]);
                console.log(`== ${find}: by host and referer`); await ask([proxy, has], ["$workers.event.request.headers.host", "$workers.event.request.headers.referer"]);
              }
            })().catch(e => console.log("failed:", e.message));'
        env:
          CF_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN }}
          DOMAIN: jaypengx.com
          FIND: ${{ inputs.find }}
      - name: Listen
        run: |
          if [ "$CPU" != "true" ]; then timeout "$(( ${MINUTES:-6} * 60 ))" npx --yes wrangler@4 tail "$WORKER" --format pretty || true; exit 0; fi
          # (The listener ends the pipe itself: a timeout on npx left wrangler holding it open.)
          timeout -k 5 "$(( ${MINUTES:-6} * 60 + 20 ))" npx --yes wrangler@4 tail "$WORKER" --format json 2> "$RUNNER_TEMP/tail.err" | node -e '
            const by = {}; let buf = "";
            const add = e => {
              const r = e.event?.request, c = e.event?.cron;
              const u = r ? new URL(r.url) : null;
              // (A phone asks on the domain, /api/…; our own tools on api. or workers.dev. A data read by its app.)
              const sp = u && /^(\/api)?\/sports-proxy$/.test(u.pathname);
              // (A test ask tagged probe=… counts apart, by its tag: one kind of answer timed alone.)
              const key = c ? `cron ${c}` : u ? `${r.method} ${u.pathname}${sp ? (u.searchParams.has("batch") ? " batch" : " " + (u.searchParams.get("url") || "").split("/")[2]) + " " + (u.searchParams.get("app") || "?") : ""}${u.searchParams.get("probe") ? " probe=" + u.searchParams.get("probe").slice(0, 20) : ""}` : (e.eventType || "other");
              const k = (by[key] ||= { n: 0, cpu: 0, wall: 0 });
              k.n++; k.cpu += e.cpuTime || 0; k.wall += e.wallTime || 0;
              // (Who asked: a page on the domain, /api/…, or a direct call; from where, through which colo and network.)
              const f = r?.cf || {};
              const who = c ? "cron" : `${u?.pathname.startsWith("/api/") ? "page" : "direct"} ${f.country || "?"} ${f.colo || "?"} ${f.asOrganization || f.asn || "?"}`;
              const w = (from[who] ||= { n: 0, cpu: 0 });
              w.n++; w.cpu += e.cpuTime || 0;
            };
            const from = {};
            let raw = "";
            const finish = () => { if (!Object.keys(by).length) console.log("nothing parsed; the stream began:", JSON.stringify(raw.slice(0, 1500))); const rows = Object.entries(by).sort((a, b) => b[1].cpu - a[1].cpu); const all = rows.reduce((s, [, v]) => s + v.cpu, 0); console.log("cpu ms in all:", all, "(cpu ms, count, wall ms, what)"); for (const [k, v] of rows) console.log(String(v.cpu).padStart(8), String(v.n).padStart(6), String(Math.round(v.wall)).padStart(9), k); console.log("== by caller (cpu ms, count; page: a page on the domain, direct: api. or workers.dev), country, colo, network"); for (const [k, v] of Object.entries(from).sort((a, b) => b[1].cpu - a[1].cpu)) console.log(String(v.cpu).padStart(8), String(v.n).padStart(6), k); process.exit(0); };
            setTimeout(finish, Number(process.env.MINUTES || 6) * 60_000);
            process.stdin.on("data", d => { if (raw.length < 1500) raw += d; buf += d; let i; while ((i = buf.indexOf("\n}\n")) >= 0) { const one = buf.slice(0, i + 2); buf = buf.slice(i + 3); try { add(JSON.parse(one)); } catch {} } });
            process.stdin.on("end", finish);' || true
          echo "== wrangler said:"; head -c 1500 "$RUNNER_TEMP/tail.err" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER: ${{ inputs.worker }}
          MINUTES: ${{ inputs.minutes }}
          CPU: ${{ inputs.cpu }}
