# A Worker's live logs for a few minutes (Run workflow, by hand): what a cron
# or a request printed, without signing in to Cloudflare; or (cpu) where its
# CPU goes, by route and cron. Read-only.
name: Tail a Worker
on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which Worker
        type: choice
        options: [quota-guard, orbit-workers-proxy, gemini-relay]
        default: quota-guard
      minutes:
        description: How long to listen (1-15)
        default: '6'
      cpu:
        description: Instead of the logs, each route's and cron's count and CPU (ms) summed
        type: boolean
        default: false
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Every Worker in the account and its crons; the account's plans
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for w in $(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result||[]).map(x=>x.id).join(" "));if(!j.success)console.error(JSON.stringify(j.errors))})'); do
            printf '%s: ' "$w"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts/$w/schedules" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((j.result?.schedules||[]).map(x=>x.cron).join(" | ")||"none")})'
          done
          echo "== subscriptions"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/subscriptions" | head -c 1500; echo
          echo "== workers account settings"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/account-settings" | head -c 600; echo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Each Worker's crons and address, as Cloudflare has them
        run: |
          for w in quota-guard orbit-workers-proxy gemini-relay; do
            echo "== $w"
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w/schedules" | head -c 600; echo
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$w/subdomain" | head -c 300; echo
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Listen
        run: |
          if [ "$CPU" != "true" ]; then timeout "$(( ${MINUTES:-6} * 60 ))" npx --yes wrangler@4 tail "$WORKER" --format pretty || true; exit 0; fi
          (timeout "$(( ${MINUTES:-6} * 60 ))" npx --yes wrangler@4 tail "$WORKER" --format json || true) | node -e '
            const by = {}; let buf = "";
            const add = e => {
              const r = e.event?.request, c = e.event?.cron;
              const u = r ? new URL(r.url) : null;
              const key = c ? `cron ${c}` : u ? `${r.method} ${u.pathname}${u.pathname === "/sports-proxy" ? (u.searchParams.has("batch") ? " batch" : " " + (u.searchParams.get("url") || "").split("/")[2]) : ""}` : (e.eventType || "other");
              const k = (by[key] ||= { n: 0, cpu: 0, wall: 0 });
              k.n++; k.cpu += e.cpuTime || 0; k.wall += e.wallTime || 0;
            };
            process.stdin.on("data", d => { buf += d; let i; while ((i = buf.indexOf("\n}\n")) >= 0) { const one = buf.slice(0, i + 2); buf = buf.slice(i + 3); try { add(JSON.parse(one)); } catch {} } });
            process.stdin.on("end", () => { try { add(JSON.parse(buf)); } catch {} const rows = Object.entries(by).sort((a, b) => b[1].cpu - a[1].cpu); const all = rows.reduce((s, [, v]) => s + v.cpu, 0); console.log("cpu ms in all:", all); for (const [k, v] of rows) console.log(String(v.cpu).padStart(8), String(v.n).padStart(6), String(Math.round(v.wall)).padStart(9), k); });'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER: ${{ inputs.worker }}
          MINUTES: ${{ inputs.minutes }}
          CPU: ${{ inputs.cpu }}
