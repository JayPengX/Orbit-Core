# TEMPORARY (one run, then removed): has the proxy copy its Gemini key onto
# the longshot Worker (worker.js copyGeminiKeyToLongshot). deploy.yml deploys
# the route on the same push; until then it answers 404, so this retries.
name: Copy the Gemini key to longshot
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/longshot-gemini-key.yml'
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://orbit-workers-proxy.pengzjay.workers.dev/ops/longshot-gemini-key)
            echo "try $i: $code"
            [ "$code" = 204 ] && exit 0
            sleep 15
          done
          exit 1
