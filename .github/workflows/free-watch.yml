# The free plans' watch (tools/free-watch.mjs): every page and route a phone
# reaches, the cron jobs' health, and every allowance (Cloudflare's day,
# Google's month) against its free amount. From 2026-11-13 Orbit pays only for
# its domain. Started every 3 hours by the proxy's cron (ops.js startFreeWatch),
# never by GitHub's own timer too (two runs counted one blip twice). It never
# fails: what's wrong is handed to the proxy, whose alert mail says it
# (mail-alerts.js), so GitHub mails nothing (Jay 11-24).
name: Free plans' watch

on:
  workflow_dispatch:
    inputs:
      trace:
        description: 'Hours of saves to trace (ops trace), empty for none'
        required: false
        default: ''
      rekey:
        description: 'An account to rekey (ops rekey): <8 chars>, or <8 chars>:go to write'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages, routes, cron jobs and allowances
        run: node tools/free-watch.mjs
        env:
          DATA_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN }}
          TRACE: ${{ inputs.trace }}
          REKEY: ${{ inputs.rekey }}
