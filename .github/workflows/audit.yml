# By hand (Run workflow), read-only: each Worker's secret names (never
# values), for the README's secrets table, and the Pass's store counted
# (never a document).
name: Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Secret names per Worker
        run: |
          cd "$RUNNER_TEMP"
          for w in orbit-workers-proxy gemini-relay quota-guard sports-proxy; do
            echo "== $w"
            npx --yes wrangler@4 secret list --name "$w" 2>&1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s.slice(s.indexOf("["))).map(x=>x.name).join(" ")||"(none)")}catch{console.log(s.split("\n").filter(l=>/ERROR|not found|Authentication/i.test(l)).join(" ").slice(0,200)||"(unreadable)")}})'
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Pass's store, counted (never a document): its collections, and
      # what from before the money lock-down (2026-10-12 09:00 UTC) is still
      # waiting: slips and tickets staked then, not paid, not watched.
      - name: The store, counted
        run: |
          cd "$RUNNER_TEMP"
          q() { npx --yes wrangler@4 d1 execute quadra-store --remote --json --command "$1" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s)[0].results))}catch{console.log("(unreadable)")}})'; }
          echo "== documents by collection"; q "SELECT coll, COUNT(*) AS n FROM docs GROUP BY coll"
          echo "== pre-lock slips unpaid and unwatched"
          q "SELECT COUNT(*) AS n FROM docs w, json_each(w.payload, '\$.entries') e WHERE w.coll = 'eco-wallets' AND json_extract(e.value, '\$.kind') = 'stake' AND json_extract(e.value, '\$.t') < 1791795600000 AND NOT EXISTS (SELECT 1 FROM json_each(w.payload, '\$.entries') p WHERE json_extract(p.value, '\$.id') = 'odds:payout-' || substr(json_extract(e.value, '\$.id'), 12)) AND NOT EXISTS (SELECT 1 FROM docs o WHERE o.coll = 'odds-open' AND o.id = w.id || '_' || substr(json_extract(e.value, '\$.id'), 12))"
          echo "== pre-lock tickets unpaid and unwatched"
          q "SELECT COUNT(*) AS n FROM docs w, json_each(w.payload, '\$.entries') e WHERE w.coll = 'eco-wallets' AND json_extract(e.value, '\$.kind') = 'lottery' AND json_extract(e.value, '\$.t') < 1791795600000 AND NOT EXISTS (SELECT 1 FROM json_each(w.payload, '\$.entries') p WHERE json_extract(p.value, '\$.id') = 'odds:prize-' || substr(json_extract(e.value, '\$.id'), 12)) AND NOT EXISTS (SELECT 1 FROM docs o WHERE o.coll = 'odds-tickets' AND o.id = w.id || '_' || substr(json_extract(e.value, '\$.id'), 12))"
          echo "== watched now"; q "SELECT coll, COUNT(*) AS n FROM docs WHERE coll IN ('odds-open', 'odds-tickets') GROUP BY coll"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
