name: Deploy Cloudflare Worker

on:
  push:
    branches: ['main']
    # Everything the Workers run (any root module: worker.js imports most of
    # them, and a missing one here meant a change never deployed).
    paths:
      - '*.js'
      - 'builders/**'
      - 'kit/**'
      - 'locales/**'
      - 'wrangler.toml'
      - 'wrangler.gemini.toml'
      - 'wrangler.site.toml'
      - '.github/workflows/deploy.yml'
  # On 6 December (the Firebase key off: sign-ins it signed ran out on
  # 2026-12-05), even if nothing was pushed.
  schedule:
    - cron: '17 3 6 12 *'
  workflow_dispatch:

# One deploy at a time; pushes made while one runs wait as one (the latest),
# not a queue of each. Never cancelled midway: a Worker half-deployed is worse.
concurrency:
  group: 'workers'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # The family's data (R2 bucket orbit-data, in Asia-Pacific; data.js):
      # made once, and bound to the proxy when it's there. R2 has to be
      # turned on once in the dashboard (MAP.md §10); until then the proxy
      # deploys without it and /data/ answers from Shared-Data's Pages.
      - name: The data bucket
        continue-on-error: true
        run: |
          if ! npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -qE 'name:\s*orbit-data'; then npx --yes wrangler@4 r2 bucket create orbit-data --location apac; fi
          printf '\n[[r2_buckets]]\nbinding = "DATA"\nbucket_name = "orbit-data"\n' >> wrangler.toml
          echo "orbit-data bound as DATA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Pass's store on Cloudflare (D1 orbit-store, doc-store.js): made
      # once and bound to the proxy with its id (the Worker makes its table).
      # The deploy token needs Account · D1 · Edit (MAP.md §10).
      - name: The store database
        continue-on-error: true
        run: |
          id=$(npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="orbit-store");console.log(d?d.uuid:"")}catch{console.log("")}})')
          if [ -z "$id" ]; then npx --yes wrangler@4 d1 create orbit-store --location apac; id=$(npx --yes wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="orbit-store");console.log(d?d.uuid:"")})'); fi
          [ -n "$id" ] || exit 1
          printf '\n[[d1_databases]]\nbinding = "STORE"\ndatabase_name = "orbit-store"\ndatabase_id = "%s"\n' "$id" >> wrangler.toml
          echo "orbit-store bound as STORE ($id)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # What changed since the last deploy (Jay 2026-11-24: a final's notice came 16 minutes
      # late through 8 deploys in half an hour). Each deploy, and each secret put on its own,
      # is a new version of the proxy, and every version starts its Runner over (the crons'
      # object, notices among them): a push that changed only the kit's pages, or nothing
      # the Workers run, restarted it about 7 times. Now the Workers as built (wrangler's dry
      # run) and the secrets are each hashed and compared with the last deploy's (kept in the
      # proxy's KV, deploy:hashes); only what changed goes. Unread, everything goes as before.
      - name: What changed
        run: |
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/b-proxy >/dev/null
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/b-gemini --config wrangler.gemini.toml >/dev/null
          code=$( (cat wrangler.toml wrangler.gemini.toml; find /tmp/b-proxy /tmp/b-gemini -type f -not -name '*.map' -not -name 'README.md' | sort | xargs cat) | sha256sum | cut -c1-32)
          sec=$(printf '%s|' "$ECO_TOKEN_SECRET" "$DATA_PUSH_SECRET" "$LAW_BUILD_KEY" "$ANTHROPIC_API_KEY" "$OPENAI_API_KEY" "$RESEND_API_KEY" "$ECO_ADMIN_TOKEN" | sha256sum | cut -c1-32)
          kv="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/8b24d75fbe0a4a69aef0f35cb7a8d847/values/deploy%3Ahashes"
          was=$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$kv" 2>/dev/null || true)
          echo "CODE_HASH=$code" >> "$GITHUB_ENV"
          echo "SECRETS_HASH=$sec" >> "$GITHUB_ENV"
          case "$was" in "$code "*) echo "SAME_CODE=yes" >> "$GITHUB_ENV";; esac
          case "$was" in *" $sec") echo "SAME_SECRETS=yes" >> "$GITHUB_ENV";; esac
          echo "last: ${was:-none} now: $code $sec"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ECO_TOKEN_SECRET: ${{ secrets.ECO_TOKEN_SECRET }}
          DATA_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET }}
          LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ECO_ADMIN_TOKEN: ${{ secrets.ECO_ADMIN_TOKEN }}
      # Gemini's relay, pinned to Taiwan (gemini-relay.js): before the proxy that binds it.
      - name: Deploy gemini-relay
        if: ${{ env.SAME_CODE != 'yes' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.gemini.toml
          wranglerVersion: '4'
      - name: Deploy orbit-workers-proxy (the proxy, every route)
        if: ${{ env.SAME_CODE != 'yes' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # wrangler.toml's [placement] uses `region` (explicit cloud-region
          # placement, see that file's own comment) instead of the older
          # `mode = "smart"`: Wrangler 3.90 fails it ("placement.mode is a
          # required field"), so pinned to major version 4.
          wranglerVersion: '4'
      # The proxy's secrets, those the repo has, all in one version (one at a time each made its
      # own), and only when one changed. ECO_TOKEN_SECRET (orbit-token.js: the Pass's tokens),
      # DATA_PUSH_SECRET (the builders' and /ops'), LAW_BUILD_KEY (law-hosts.js), ANTHROPIC_API_KEY
      # and OPENAI_API_KEY (paid AI, Jay 11-10), RESEND_API_KEY (mail.js), ECO_ADMIN_TOKEN (the
      # owner's, tools/issue-passes.mjs).
      - name: The proxy's secrets
        if: ${{ env.SAME_SECRETS != 'yes' }}
        run: |
          node -e 'const o={};for(const k of ["ECO_TOKEN_SECRET","DATA_PUSH_SECRET","LAW_BUILD_KEY","ANTHROPIC_API_KEY","OPENAI_API_KEY","RESEND_API_KEY","ECO_ADMIN_TOKEN"])if(process.env[k])o[k]=process.env[k];require("fs").writeFileSync("/tmp/secrets.json",JSON.stringify(o));console.log(Object.keys(o).length+" secrets")'
          npx --yes wrangler@4 secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ECO_TOKEN_SECRET: ${{ secrets.ECO_TOKEN_SECRET }}
          DATA_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET }}
          LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ECO_ADMIN_TOKEN: ${{ secrets.ECO_ADMIN_TOKEN }}
      # What went, for the next deploy to compare (a failed write: the next one goes whole).
      - name: Keep what was deployed
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data "$CODE_HASH $SECRETS_HASH" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/8b24d75fbe0a4a69aef0f35cb7a8d847/values/deploy%3Ahashes" >/dev/null && echo kept
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # FIREBASE_PRIVATE_KEY off the proxy from 2026-12-06: sign-ins made
      # before ECO_TOKEN_SECRET (2026-10-05, 60 days) were signed with a key
      # made from it (orbit-token.js), and the last ran out on 2026-12-05.
      - name: The Firebase key off the proxy
        continue-on-error: true
        run: |
          have=$(npx --yes wrangler@4 secret list --name orbit-workers-proxy 2>/dev/null || true)
          [ "$(date -u +%Y%m%d)" -ge 20261206 ] || exit 0
          if printf '%s' "$have" | grep -q '"FIREBASE_PRIVATE_KEY"'; then echo y | npx --yes wrangler@4 secret delete FIREBASE_PRIVATE_KEY --name orbit-workers-proxy && echo "FIREBASE_PRIVATE_KEY removed"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # A deploy turns a Worker's workers.dev address and crons back on: while
      # the guard has the proxies stopped (the plan's amounts nearly used),
      # they go off again now, not at the guard's next run.
      # (Read by Cloudflare's API with a time limit: wrangler's own read once
      # hung half an hour and held every deploy behind it.)
      - name: Keep the guard's stop
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          state=$(curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/8b24d75fbe0a4a69aef0f35cb7a8d847/values/guard%3Astate" || true)
          stopped=$(printf '%s' "$state" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).stopped?"yes":"no")}catch{console.log("no")}})')
          echo "stopped: $stopped"
          echo "GUARD_STOPPED=$stopped" >> "$GITHUB_ENV"
          [ "$stopped" = "yes" ] || exit 0
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          for w in orbit-workers-proxy; do
            curl -fsS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$w/subdomain" >/dev/null && echo "$w address off"
            curl -fsS --max-time 30 -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d '[]' "$api/$w/schedules" >/dev/null && echo "$w crons off"
          done
          # The proxy's routes (orbit.<domain>/api/…, wrangler.toml) and api.<domain>, which this deploy put back.
          domain=$(node -e 'import("./kit/domain.mjs").then(m=>console.log(m.DOMAIN.trim().toLowerCase()))')
          [ -n "$domain" ] || exit 0
          cf="https://api.cloudflare.com/client/v4"
          zone=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/zones?name=$domain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$zone" ] || exit 0
          for id in $(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/zones/$zone/workers/routes" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result.filter(r=>r.script==="orbit-workers-proxy").map(r=>r.id).join(" "))}catch{}})'); do
            curl -fsS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/zones/$zone/workers/routes/$id" >/dev/null && echo "proxy route $id off"
          done
          for id in $(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?service=orbit-workers-proxy" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result.map(d=>d.id).join(" "))}catch{}})'); do
            curl -fsS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$id" >/dev/null && echo "proxy domain $id off"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The family's own domain (kit/domain.mjs DOMAIN; nothing while it's
      # empty): orbit-site (site.js, the apps read through from GitHub Pages)
      # deployed, and the hostnames attached as Workers custom domains,
      # orbit.<DOMAIN> (the apps), <DOMAIN> (Jay's homepage and the showcase)
      # and longshot.<DOMAIN> (only Longshot's shutdown notice) to orbit-site, api.<DOMAIN> to the proxy (Cloudflare makes
      # their DNS records and certificates). Safe to repeat: an attached one
      # is left as it is. While the guard has the proxies stopped, nothing is
      # attached: the guard puts the domains back with them.
      - name: The family's own domain
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          domain=$(node -e 'import("./kit/domain.mjs").then(m=>console.log(m.DOMAIN.trim().toLowerCase()))')
          [ -n "$domain" ] || { echo "no domain yet (kit/domain.mjs)"; exit 0; }
          npx --yes wrangler@4 deploy --config wrangler.site.toml
          [ "$GUARD_STOPPED" = "yes" ] && { echo "the guard has the proxies stopped: domains left off"; exit 0; }
          cf="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone=$(curl -sS --max-time 30 -H "$auth" "$cf/zones?name=$domain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$zone" ] || { echo "::error::$domain is not a zone the deploy token can see (the token needs this zone: MAP.md §10)"; exit 1; }
          fail=0
          for pair in "orbit.$domain orbit-site" "$domain orbit-site" "longshot.$domain orbit-site" "api.$domain orbit-workers-proxy"; do
            set -- $pair
            out=$(curl -sS --max-time 60 -X PUT -H "$auth" -H 'Content-Type: application/json' -d "{\"environment\":\"production\",\"hostname\":\"$1\",\"service\":\"$2\",\"zone_id\":\"$zone\"}" "$cf/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
            if printf '%s' "$out" | grep -qE '"success": ?true'; then echo "$1 → $2"; else echo "::error::$1 → $2 not attached: $out"; fail=1; fi
          done
          exit $fail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
