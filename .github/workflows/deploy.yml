name: Deploy Cloudflare Worker

on:
  push:
    branches: ['main']
    # Everything the Workers run (any root module: worker.js imports most of
    # them, and a missing one here meant a change never deployed).
    paths:
      - '*.js'
      - 'builders/**'
      - 'kit/**'
      - 'locales/**'
      - 'wrangler.toml'
      - 'wrangler.gemini.toml'
      - '.github/workflows/deploy.yml'
  # On 20 October (the old sports-proxy deleted) and 6 December (the
  # Firebase key off: sign-ins it signed ran out on 2026-12-05), even if
  # nothing was pushed.
  schedule:
    - cron: '17 3 6 12 *'
    - cron: '17 3 20 10 *'
  workflow_dispatch:

# One deploy at a time; pushes made while one runs wait as one (the latest),
# not a queue of each. Never cancelled midway: a Worker half-deployed is worse.
concurrency:
  group: 'workers'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN_SECRET: ${{ secrets.ECO_TOKEN_SECRET != '' }}
      HAS_ADMIN_TOKEN: ${{ secrets.ECO_ADMIN_TOKEN != '' }}
      HAS_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET != '' }}
      HAS_LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY != '' }}
    steps:
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # The family's data (R2 bucket orbit-data, in Asia-Pacific; data.js):
      # made once, and bound to the proxy when it's there. R2 has to be
      # turned on once in the dashboard (README §11); until then the proxy
      # deploys without it and /data/ answers from Shared-Data's Pages.
      - name: The data bucket
        continue-on-error: true
        run: |
          if ! npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -qE 'name:\s*orbit-data'; then npx --yes wrangler@4 r2 bucket create orbit-data --location apac; fi
          printf '\n[[r2_buckets]]\nbinding = "DATA"\nbucket_name = "orbit-data"\n' >> wrangler.toml
          echo "orbit-data bound as DATA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Pass's store on Cloudflare (D1 orbit-store, doc-store.js): made
      # once and bound to the proxy with its id (the Worker makes its table).
      # The deploy token needs Account · D1 · Edit (README §11).
      - name: The store database
        continue-on-error: true
        run: |
          id=$(npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="orbit-store");console.log(d?d.uuid:"")}catch{console.log("")}})')
          if [ -z "$id" ]; then npx --yes wrangler@4 d1 create orbit-store --location apac; id=$(npx --yes wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="orbit-store");console.log(d?d.uuid:"")})'); fi
          [ -n "$id" ] || exit 1
          printf '\n[[d1_databases]]\nbinding = "STORE"\ndatabase_name = "orbit-store"\ndatabase_id = "%s"\n' "$id" >> wrangler.toml
          echo "orbit-store bound as STORE ($id)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Gemini's relay, pinned to Taiwan (gemini-relay.js): before the proxy that binds it.
      - name: Deploy gemini-relay
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.gemini.toml
          wranglerVersion: '4'
      - name: Deploy orbit-workers-proxy (the proxy, every route)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # wrangler.toml's [placement] uses `region` (explicit cloud-region
          # placement, see that file's own comment) instead of the older
          # `mode = "smart"` - Wrangler 3.90 (this action's actual installed
          # default as of this writing, despite its docs claiming v4) doesn't
          # recognize that on its own and fails config validation with
          # "placement.mode is a required field". Pinned to major version 4
          # explicitly rather than relying on the action's own default,
          # so a future change to that default can't silently break this
          # again the same way.
          wranglerVersion: '4'
      # The old address (sports-proxy.pengzjay.workers.dev, a forwarder to the
      # proxy since the move on 2026-10-13): no code calls it, and a phone on
      # an older kit takes the new one at its next opening; 10 minutes of its
      # logs on 2026-10-14 had no request. Its code is gone from the repo; the
      # Worker itself goes after a quiet week, from 2026-10-20 (the workflow
      # also runs that day). guard.js treats it gone as nothing to stop.
      - name: The old sports-proxy Worker deleted
        continue-on-error: true
        run: |
          [ "$(date -u +%Y%m%d)" -ge 20261020 ] || { echo "kept until 2026-10-20"; exit 0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/sports-proxy/settings")
          [ "$code" = "200" ] || { echo "already gone ($code)"; exit 0; }
          # (The name is wrangler delete's argument; run outside the checkout so
          # no wrangler.toml can stand in for it.)
          cd "$RUNNER_TEMP" && npx --yes wrangler@4 delete sports-proxy --force && echo "sports-proxy deleted"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Orbit Pass token secret (see orbit-token.js): /eco signs
      # session tokens with it and every route checks them. Only when the repo has the secret
      # ECO_TOKEN_SECRET (any long random string); until then the proxy's
      # Orbit Pass gate is simply off.
      - name: Orbit Pass token secret on the proxy
        if: ${{ env.HAS_TOKEN_SECRET == 'true' }}
        run: |
          printf '%s' "$ECO_TOKEN_SECRET" | npx --yes wrangler@4 secret put ECO_TOKEN_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ECO_TOKEN_SECRET: ${{ secrets.ECO_TOKEN_SECRET }}
      # The builders' key to write the family's data (data.js /data/push; the
      # same secret is Shared-Data's).
      - name: The data push secret on the proxy
        if: ${{ env.HAS_PUSH_SECRET == 'true' }}
        run: printf '%s' "$DATA_PUSH_SECRET" | npx --yes wrangler@4 secret put DATA_PUSH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_PUSH_SECRET: ${{ secrets.DATA_PUSH_SECRET }}
      # Orbit Law's build key (law-hosts.js: /law-page reads the Taiwan-only
      # county 法規 sites for its nightly build; the same secret is Orbit-Law's).
      - name: Orbit Law's build key on the proxy
        if: ${{ env.HAS_LAW_BUILD_KEY == 'true' }}
        run: printf '%s' "$LAW_BUILD_KEY" | npx --yes wrangler@4 secret put LAW_BUILD_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LAW_BUILD_KEY: ${{ secrets.LAW_BUILD_KEY }}
      # The owner's admin token (tools/issue-passes.mjs makes it and keeps it
      # on the owner's computer): handing out passes, /eco op 'admin'.
      - name: Owner's admin token on the eco Worker
        if: ${{ env.HAS_ADMIN_TOKEN == 'true' }}
        run: printf '%s' "$ECO_ADMIN_TOKEN" | npx --yes wrangler@4 secret put ECO_ADMIN_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ECO_ADMIN_TOKEN: ${{ secrets.ECO_ADMIN_TOKEN }}
      # Retired secrets taken off the proxy: Firebase's (the store is D1,
      # doc-store.js) and MATCH_FIND_DISPATCH_TOKEN (a GitHub token for the
      # /match-dispatch route, removed long ago). FIREBASE_PRIVATE_KEY stays
      # until 2026-12-05: sign-ins made before ECO_TOKEN_SECRET (2026-10-05,
      # 60 days) were signed with a key made from it (orbit-token.js).
      - name: Retired secrets off the proxy
        continue-on-error: true
        run: |
          have=$(npx --yes wrangler@4 secret list --name orbit-workers-proxy 2>/dev/null || true)
          gone="FIREBASE_CLIENT_EMAIL FIREBASE_PROJECT_ID MATCH_FIND_DISPATCH_TOKEN"
          [ "$(date -u +%Y%m%d)" -ge 20261206 ] && gone="$gone FIREBASE_PRIVATE_KEY"
          for s in $gone; do
            if printf '%s' "$have" | grep -q "\"$s\""; then echo y | npx --yes wrangler@4 secret delete "$s" --name orbit-workers-proxy && echo "$s removed"; fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # A deploy turns a Worker's workers.dev address and crons back on: while
      # the guard has the proxies stopped (the plan's amounts nearly used),
      # they go off again now, not at the guard's next run.
      # (Read by Cloudflare's API with a time limit: wrangler's own read once
      # hung half an hour and held every deploy behind it.)
      - name: Keep the guard's stop
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          state=$(curl -fsS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/8b24d75fbe0a4a69aef0f35cb7a8d847/values/guard%3Astate" || true)
          stopped=$(printf '%s' "$state" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).stopped?"yes":"no")}catch{console.log("no")}})')
          echo "stopped: $stopped"
          [ "$stopped" = "yes" ] || exit 0
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          for w in orbit-workers-proxy sports-proxy; do
            # (sports-proxy deleted from 2026-10-20: its calls fail, nothing to stop.)
            curl -fsS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$w/subdomain" >/dev/null && echo "$w address off"
            curl -fsS --max-time 30 -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d '[]' "$api/$w/schedules" >/dev/null && echo "$w crons off"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
