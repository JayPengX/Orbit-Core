name: Deploy Cloudflare Worker

on:
  push:
    branches: ['main']
    paths:
      - 'worker.js'
      - 'kit/brand.mjs'
      - 'wrangler.toml'
      - 'sports-proxy-worker.js'
      - 'asia-baseball.js'
      - 'kit/catalog.mjs'
      - 'f1-live.js'
      - 'wrangler.sports-proxy.toml'
      - 'locales/**'
      - 'eco.js'
      - 'kambi.js'
      - 'settle.js'
      - 'kit/settle.mjs'
      - 'kit/play-odds.mjs'
      - 'kit/play-props.mjs'
      - 'kit/play-rules.mjs'
      - 'kit/logos.mjs'
      - 'kit/f1live.mjs'
      - 'quadra-token.js'
      - 'push.js'
      - 'eco-admin.js'
      - 'money.js'
      - 'capacity.js'
      - 'weather.js'
      - 'weather-stations.js'
      - 'weather-skill.js'
      - 'transit.js'
      - 'kit/devconfig.mjs'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN_SECRET: ${{ secrets.ECO_TOKEN_SECRET != '' }}
      HAS_ADMIN_TOKEN: ${{ secrets.ECO_ADMIN_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy orbit-workers-proxy (eco/gemini/nl-edit/kambi)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # wrangler.toml's [placement] uses `region` (explicit cloud-region
          # placement, see that file's own comment) instead of the older
          # `mode = "smart"` - Wrangler 3.90 (this action's actual installed
          # default as of this writing, despite its docs claiming v4) doesn't
          # recognize that on its own and fails config validation with
          # "placement.mode is a required field". Pinned to major version 4
          # explicitly rather than relying on the action's own default,
          # so a future change to that default can't silently break this
          # again the same way.
          wranglerVersion: '4'
      - name: Deploy sports-proxy (Match Find's own route, no region pin - see wrangler.sports-proxy.toml)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.sports-proxy.toml
          wranglerVersion: '4'
      # The Quadra Pass token secret, the same on both Workers (see
      # quadra-token.js): /eco signs session tokens with it and
      # /sports-proxy checks them. Only when the repo has the secret
      # ECO_TOKEN_SECRET (any long random string); until then the proxy's
      # Quadra Pass gate is simply off.
      - name: Quadra Pass token secret on both Workers
        if: ${{ env.HAS_TOKEN_SECRET == 'true' }}
        run: |
          printf '%s' "$ECO_TOKEN_SECRET" | npx --yes wrangler@4 secret put ECO_TOKEN_SECRET
          printf '%s' "$ECO_TOKEN_SECRET" | npx --yes wrangler@4 secret put ECO_TOKEN_SECRET --config wrangler.sports-proxy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECO_TOKEN_SECRET: ${{ secrets.ECO_TOKEN_SECRET }}
      # The owner's admin token (tools/issue-passes.mjs makes it and keeps it
      # on the owner's computer): handing out passes, /eco op 'admin'.
      - name: Owner's admin token on the eco Worker
        if: ${{ env.HAS_ADMIN_TOKEN == 'true' }}
        run: printf '%s' "$ECO_ADMIN_TOKEN" | npx --yes wrangler@4 secret put ECO_ADMIN_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECO_ADMIN_TOKEN: ${{ secrets.ECO_ADMIN_TOKEN }}
