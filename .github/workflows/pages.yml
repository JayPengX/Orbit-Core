# The shared kit (kit/) and the family's home page (site/) on GitHub Pages,
# at https://jaypengx.github.io/Shared-Proxy/: every app loads the kit from
# here (kit/loader.html), so a change to the kit is this one push.
# One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
name: Kit to Pages

on:
  push:
    branches: ['main']
    paths:
      - 'kit/**'
      # (A test fixed after a failed run publishes the kit that run held back.)
      - 'tests/**'
      - 'site/**'
      - 'brand/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  # One deploy at a time, without cancelling any (a cancelled run mails its
  # pusher): a run waits for the earlier ones still going, and steps aside,
  # quietly, when a newer run of this workflow will deploy instead.
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      go: ${{ steps.wait.outputs.go }}
    steps:
      - name: Wait for the earlier deploys; step aside for a newer one
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2" 2>/dev/null; }
          wf=$(api "actions/runs/$GITHUB_RUN_ID" .workflow_id) || wf=
          while [ -n "$wf" ]; do
            runs=$(api "actions/workflows/$wf/runs?branch=$GITHUB_REF_NAME&per_page=30" "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID) | {n: .run_number, done: (.status == \"completed\")}]") || runs='[]'
            if [ "$(jq "[.[] | select(.n > $GITHUB_RUN_NUMBER)] | length" <<<"$runs")" != 0 ]; then
              echo "A newer run deploys instead."; echo go=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "$(jq "[.[] | select(.n < $GITHUB_RUN_NUMBER and (.done | not))] | length" <<<"$runs")" = 0 ] && break
            echo "Waiting for an earlier run to finish."; sleep 20
          done
          echo go=true >> "$GITHUB_OUTPUT"

  build:
    needs: queue
    if: needs.queue.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # main as it is now, never the commit that started the run: GitHub can
      # deliver a push late (hours, out of order), and an old tree deployed
      # after a newer one would take the live app back.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Build the site (the kit stamped with this version)
        run: |
          mkdir -p _site
          if [ -d site ]; then cp -r site/. _site/; fi
          node kit/stamp.mjs _site "$(git rev-parse HEAD)"
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (Source: GitHub Actions) the first time, if the
          # token may; otherwise Settings -> Pages -> Source: GitHub Actions.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # A clash with another deploy or a hiccup at GitHub: tried once more.
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (again)
        id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
