# TEMPORARY: deploys Longshot's own Worker (JayPengX/Longshot, worker/)
# with this repo's Cloudflare token, until the owner adds CLOUDFLARE_API_TOKEN
# to the Longshot repo, whose worker.yml then takes over.
# Delete this file then. Longshot shares nothing with this repo's Workers.
name: Longshot bridge

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/longshot-bridge.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Longshot branch to deploy'
        default: 'main'

concurrency:
  group: 'longshot'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LONGSHOT_REF: ${{ inputs.ref || 'main' }}
    steps:
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Checkout Longshot
        uses: actions/checkout@v4
        with:
          repository: JayPengX/Longshot
          ref: ${{ env.LONGSHOT_REF }}
          path: longshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Longshot's tests
        working-directory: longshot
        run: npm test
      - name: Longshot's bucket and store
        working-directory: longshot/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! npx --yes wrangler@4 r2 bucket list 2>/dev/null | grep -qE 'name:\s*longshot-data$'; then npx --yes wrangler@4 r2 bucket create longshot-data --location apac || true; fi
          printf '\n[[r2_buckets]]\nbinding = "DATA"\nbucket_name = "longshot-data"\n' >> wrangler.toml
          find_id() { npx --yes wrangler@4 d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="longshot-store");console.log(d?d.uuid:"")}catch{console.log("")}})'; }
          id=$(find_id); [ -n "$id" ] || { npx --yes wrangler@4 d1 create longshot-store --location apac; id=$(find_id); }
          [ -n "$id" ] || exit 1
          printf '\n[[d1_databases]]\nbinding = "STORE"\ndatabase_name = "longshot-store"\ndatabase_id = "%s"\n' "$id" >> wrangler.toml
      # (longshot-gemini, its old relay, is gone: the Worker runs in Taiwan and asks Gemini itself.)
      - name: Deploy longshot
        working-directory: longshot/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy
          npx --yes wrangler@4 delete --name longshot-gemini --force || true
