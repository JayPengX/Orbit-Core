# The hard stop on the bill (guard.js, guard-worker.js, wrangler.guard.toml):
# its own Worker and cron, deployed only when its own files change. A deploy
# registers its cron again, and its first run waits for that: deployed with
# every push to the proxy (several an hour), it never ran.
name: Deploy the bill's guard
on:
  push:
    branches: ['main']
    paths:
      - 'guard.js'
      - 'guard-worker.js'
      - 'wrangler.guard.toml'
      - '.github/workflows/deploy-guard.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # The hard stop on the bill (guard.js, wrangler.guard.toml): its own
      # Worker and cron, armed once the repo has CF_GUARD_TOKEN.
      - name: Deploy quota-guard (the hard stop on the bill)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.guard.toml
          wranglerVersion: '4'
      - name: The guard's token and account
        if: ${{ env.HAS_GUARD_TOKEN == 'true' }}
        run: |
          printf '%s' "$CF_GUARD_TOKEN" | npx --yes wrangler@4 secret put CF_GUARD_TOKEN --config wrangler.guard.toml
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4 secret put CF_ACCOUNT_ID --config wrangler.guard.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN }}
