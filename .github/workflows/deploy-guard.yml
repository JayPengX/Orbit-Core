# The hard stop on the bill (guard.js, guard-worker.js, wrangler.guard.toml):
# its own Worker and cron, deployed only when its own files change. A deploy
# registers its cron again, and its first run waits for that: deployed with
# every push to the proxy (several an hour), it never ran.
name: Deploy the bill's guard
on:
  push:
    branches: ['main']
    paths:
      - 'guard.js'
      - 'guard-worker.js'
      - 'wrangler.guard.toml'
      - '.github/workflows/deploy-guard.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN != '' }}
    steps:
      # The account: the deploy token's own (one), so it needn't be a secret.
      - name: The account
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          [ -n "$id" ] || { echo "the token sees no account"; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/checkout@v4
      # The hard stop on the bill (guard.js, wrangler.guard.toml): its own
      # Worker and cron, armed once the repo has CF_GUARD_TOKEN.
      - name: Deploy quota-guard (the hard stop on the bill)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.guard.toml
          wranglerVersion: '4'
      # The guard's token; its account is the token's own (guard.js asks once),
      # so the old CF_ACCOUNT_ID secret is taken off.
      - name: The guard's token
        if: ${{ env.HAS_GUARD_TOKEN == 'true' }}
        run: |
          printf '%s' "$CF_GUARD_TOKEN" | npx --yes wrangler@4 secret put CF_GUARD_TOKEN --config wrangler.guard.toml
          if npx --yes wrangler@4 secret list --config wrangler.guard.toml 2>/dev/null | grep -q '"CF_ACCOUNT_ID"'; then npx --yes wrangler@4 secret delete CF_ACCOUNT_ID --config wrangler.guard.toml && echo "CF_ACCOUNT_ID removed"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_GUARD_TOKEN: ${{ secrets.CF_GUARD_TOKEN }}
