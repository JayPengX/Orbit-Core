# One-off, run by hand (Jay allowed it 2026-11-01, thread
# cmsg_01L3wqR48soWb2gmDHQJ3NgkKKz9GbE48QBFUg339sdRzb): hands this repo's
# Cloudflare deploy key (CLOUDFLARE_API_TOKEN) to each app repo, so each app
# publishes its own site to Cloudflare (deploy/cf-site.mjs). It needs
# FAMILY_GH_TOKEN, a GitHub token set here only for the run (from the owner's
# computer); the run deletes it again at the end, whatever happens.
name: Share the Cloudflare deploy key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FAMILY_GH_TOKEN }}
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: The key to each app repo
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::no FAMILY_GH_TOKEN"; exit 1; }
          fail=0
          for r in Orbit-Sports Orbit-Transit Orbit-Weather Orbit-Class Orbit-Money Orbit-Words Orbit-Beats Orbit-Law Orbit-Securities Orbit-Showcase; do
            if printf '%s' "$CF" | gh secret set CLOUDFLARE_API_TOKEN -R "JayPengX/$r"; then echo "$r ok"; else echo "::error::$r not set"; fail=1; fi
          done
          exit $fail
      - name: The GitHub token deleted again
        if: ${{ always() }}
        run: gh secret delete FAMILY_GH_TOKEN -R "$GITHUB_REPOSITORY" && echo "FAMILY_GH_TOKEN deleted"
