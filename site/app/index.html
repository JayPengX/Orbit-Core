<!doctype html>
<html lang="zh-Hant" data-look="native">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Orbit</title>
<meta name="description" content="Orbit 的每個 App 都在一個圖示裡：登入一次，App 之間切換、返回都在原地。" />
<meta name="application-name" content="Orbit" />
<meta name="apple-mobile-web-app-title" content="Orbit" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Orbit" />
<meta property="og:title" content="Orbit" />
<meta property="og:description" content="Orbit 的每個 App 都在一個圖示裡。" />
<meta property="og:url" content="https://orbit.jaypengx.com/app/" />
<meta property="og:image" content="https://orbit.jaypengx.com/pass/brand/pass-og.jpg" />
<!-- Orbit: every app in one home-screen app (Orbit-Core kit/suite.mjs). This
     page is Orbit's window: each app opened is held in a frame of its own
     (kit suite.mjs host), kept running while another is shown. Opened from
     the icon it goes on with the app used last, where it was left (the
     module below picks it: suite.mjs launchTarget, something live first);
     else, and the first time, it lists the apps; in a phone's browser, it
     shows how to add Orbit to the home screen. The keys are suite.mjs's. -->
<script>
!function () {
  try {
    var ss = sessionStorage, ls = localStorage, nav = navigator, ua = nav.userAgent || '';
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || nav.standalone === true;
    var touch = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && nav.maxTouchPoints > 1);
    // (A phone's browser: added to the home screen first. Another app's own window: not Orbit's.)
    if ((touch && !standalone) || (standalone && ss.getItem('orbit.window') && ss.getItem('orbit.suite') !== '1')) return;
    ss.setItem('orbit.suite', '1');
    var s = JSON.parse(ls.getItem('orbit.suite.v1') || 'null') || { apps: {} };
    s.on = 1;
    s.t = s.t || Date.now();
    ls.setItem('orbit.suite.v1', JSON.stringify(s));
    var open = /[?&]open=([^&#]+)/.exec(location.search);
    if (open) window.ORBIT_FIRST = { url: decodeURIComponent(open[1]), y: 0 };
  } catch (e) {}
}();
</script>
<!-- kit:head -->
<script>!function(b,d,v,h,n,m,f,i,u){try{v=localStorage.getItem('orbit.kit')||'';h=JSON.parse(localStorage.getItem('orbit.kitFiles')||'null')}catch(e){v=''}n=!!v;if(!n&&d){v=d.version;h=d}h=h&&h.version===v?h.files:null;u=function(x){var k=h&&h[x];return b+x+(k?'?v='+k:v?'?v='+encodeURIComponent(v):'')};m={'#kit/':b};f=['brand.mjs','format.mjs','hold-place.mjs','lang.mjs','orbit.mjs','suite.mjs','ui.mjs'];for(i=0;i<f.length;i++)m['#kit/'+f[i]]=u(f[i]);if(h)for(i in h)/\.mjs$/.test(i)&&(m['#kit/'+i]=u(i));window.ORBIT_KIT={base:b,version:v,noted:n,url:u};document.write('<script type="import'+'map">'+JSON.stringify({imports:m})+'<\/script><link rel="stylesheet" href="'+u('orbit.css')+'">')}('/Orbit-Core/kit/',null)</script>
<!-- /kit:head -->
<style>
  .door { --q-accent: #4f46e5; box-sizing: border-box; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  /* (The list's page: no app's rail beside it, so the kit's room for one is left out.) */
  html:not(.q-suite-host) { padding: 0 !important; }
  html:not(.q-suite-host) body { max-width: none; margin: 0; padding: 0; }
  .door-head { display: flex; align-items: center; gap: 12px; padding: 4px 4px 22px; }
  .door-head img { width: 44px; height: 44px; border-radius: 11px; }
  .door-head h1 { margin: 0; color: var(--q-label); font: 700 28px/1.1 var(--q-font); letter-spacing: -0.02em; }
  .door-head p { margin: 2px 0 0; color: var(--q-label-2); font: 400 15px/1.3 var(--q-font); }
  .door img.door-icon { flex: none; width: 36px; height: 36px; border-radius: 9px; }
  .door button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  /* The app to go on with: one card, its colour only on what names it. */
  .door-hero { position: relative; display: flex; align-items: center; gap: 16px; width: 100%; margin: 0 0 28px; padding: 18px 18px 18px 18px; border: 0; border-radius: var(--q-r-card, 20px); background: var(--nv-card, var(--q-surface)); box-shadow: inset 0 0 0 0.5px var(--nv-edge, transparent), var(--nv-lift, none); text-align: left; cursor: pointer; overflow: hidden; }
  .door-hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--app) 16%, transparent), transparent 60%); pointer-events: none; }
  .door-hero img.door-icon { position: relative; width: 60px; height: 60px; border-radius: 14px; }
  .door-hero-text { position: relative; display: grid; gap: 1px; min-width: 0; flex: 1; }
  .door-hero-kicker { color: var(--q-label-2); font: 400 13px/1.3 var(--q-font); }
  .door-hero-name { color: var(--q-label); font: 600 24px/1.2 var(--q-font); letter-spacing: -0.01em; }
  .door-hero-role { color: var(--q-label-2); font: 400 15px/1.3 var(--q-font); }
  .door-go { position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--app) 20%, transparent); }
  .door-go::after { content: ''; position: absolute; left: 13px; top: 12px; width: 8px; height: 8px; border: solid var(--app); border-width: 2.2px 2.2px 0 0; transform: rotate(45deg); }
  .door-hero:active, .door-row:active { opacity: 0.6; }
  .door-live { display: inline-flex; align-items: center; gap: 6px; color: var(--app); font: 500 13px/1.3 var(--q-font); }
  .door-live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .door-group { margin: 0 0 24px; }
  .door-group h2 { margin: 0 4px 8px; color: var(--q-label-2); font: 600 15px/1.3 var(--q-font); }
  .door-rows { border-radius: var(--q-r-card, 20px); background: var(--nv-card, var(--q-surface)); box-shadow: inset 0 0 0 0.5px var(--nv-edge, transparent), var(--nv-lift, none); overflow: hidden; }
  .door-row { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 10px 16px; border: 0; background: none; text-align: left; cursor: pointer; }
  .door-row + .door-row::before { content: ''; position: absolute; top: 0; left: 66px; right: 0; height: 0.5px; background: var(--q-sep); }
  .door-name { flex: 1; min-width: 0; color: var(--q-label); font: 500 17px/1.3 var(--q-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .door-role { flex: none; color: var(--q-label-2); font: 400 15px/1.3 var(--q-font); white-space: nowrap; }
  .door-row .door-live { font-size: 15px; }
  .door-lead { margin: -6px 4px 24px; color: var(--q-label-2); font: 400 15px/1.45 var(--q-font); }
  .door-sign { display: grid; justify-items: center; gap: 10px; margin: 8px 0 0; padding: 28px 20px 20px; border-radius: 22px; background: var(--q-surface); text-align: center; }
  .door-sign h2 { margin: 0; color: var(--q-label); font: 700 22px/1.25 var(--q-font); }
  .door-sign p { margin: 0 0 10px; color: var(--q-label-2); font: 400 15px/1.4 var(--q-font); }
  .door-sign .q-btn { justify-self: stretch; }
  .door.over { position: fixed; inset: 0; z-index: 5; max-width: none; overflow-y: auto; background: var(--q-page, #f2f2f7); }
  .door.over > * { max-width: 528px; margin-left: auto; margin-right: auto; }
  /* Orbit's window: each app's frame the whole screen, as the app on its own
     (the phone's safe area written into its styles: kit suite.mjs tellInsets). */
  /* (The window itself never scrolls: an app's scroll that runs past its end
     moved the whole window on an iPhone, its tabs with it. Jay 2026-11-14.) */
  html.q-suite-host, html.q-suite-host body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--q-page, #f2f2f7); }
  html.q-suite-host body { position: fixed; inset: 0; }
  .q-suite-frames { position: fixed; pointer-events: none; inset: 0; }
  /* (color-scheme normal: an app's page before its style sheet is see-through
     to this window's own colour, never a white sheet in dark mode. Jay 2026-11-14.) */
  .q-suite-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; color-scheme: normal; background: transparent; visibility: hidden; pointer-events: none; opacity: 0; transform: scale(0.97); transition: opacity 0s linear 0.32s, transform 0s linear 0.32s, visibility 0s linear 0.32s; }
  /* (A switch: the app shown fades and settles in over the one left, which
     stays as it is underneath until then: never a see-through moment.) */
  .q-suite-frame.q-suite-shown { z-index: 1; visibility: visible; pointer-events: auto; opacity: 1; transform: none; transition: opacity 0.24s ease, transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s; }
  @media (prefers-reduced-motion: reduce) { .q-suite-frame, .q-suite-frame.q-suite-shown { transition: none; transform: none; } }
  @media (prefers-color-scheme: dark) { .door { --q-accent: #6d66f0; } html.q-suite-host, html.q-suite-host body { background: var(--q-page, #000); } }
</style>
</head>
<body>
<main class="door" id="door" hidden></main>
<div class="q-suite-frames" id="frames"></div>
<script type="module">
  const [{ installGate, isPhoneOrTablet, isStandalone, detectLang, storedAccount, orbitSession, accountSheet }, ui, { APP_ORDER, BRANDS, appIcon }, suite] = await Promise.all([import('#kit/orbit.mjs'), import('#kit/ui.mjs'), import('#kit/brand.mjs'), import('#kit/suite.mjs')]);
  const lang = detectLang();
  const en = lang === 'en';
  if (en) document.documentElement.lang = 'en';
  const W = (zh, e) => (en ? e : zh);
  const door = document.getElementById('door');
  let held = null;
  const hold = first => {
    door.hidden = true;
    document.documentElement.classList.add('q-suite-host');
    // (Should the phone move it anyway, as a field is focused: put back.)
    addEventListener('scroll', () => (scrollX || scrollY) && scrollTo(0, 0), { passive: true });
    const app = suite.appAt?.(new URL(first.url, location.href).pathname);
    // (An older kit without the host: on to the app as before.)
    if (!suite.host || !app) return void location.assign(first.url);
    if (held) return void held.go(app, first.url);
    try {
      sessionStorage.setItem('orbit.launch', String(Date.now()));
    } catch {}
    held = suite.host(document.getElementById('frames'), { first: { ...first, app }, list: () => showList() });
  };
  // The list of apps, the one used last on top (over the apps held, on a return).
  const icon = id => Object.assign(document.createElement('img'), { className: 'door-icon', src: `data:image/svg+xml,${encodeURIComponent(appIcon(id))}`, alt: '' });
  // Signed in first (Jay 2026-11-13): Orbit is the Pass's, one sign-in for every app.
  const signedIn = () => !storedAccount || !!storedAccount();
  let session = null;
  function showSignIn(then) {
    const head = ui.h('header', { class: 'door-head' }, [ui.h('img', { src: './favicon.svg', alt: '' }), ui.h('div', {}, [ui.h('h1', { text: 'Orbit' }), ui.h('p', { text: W('登入一次，每個 App 都一起登入', 'Sign in once, for every app') })])]);
    const open = () => {
      session ||= orbitSession(suite.lastApp?.(suite.savedSuite()) || APP_ORDER[0], { lang });
      accountSheet(session);
    };
    const card = ui.h('div', { class: 'door-sign' }, [ui.h('h2', { text: W('登入 Orbit Pass', 'Sign in to Orbit Pass') }), ui.h('p', { text: W('用你的 Orbit Pass 登入，或建立一個新的。', 'Use your Orbit Pass, or make a new one.') }), ui.h('button', { class: 'q-btn primary block', type: 'button', text: W('登入', 'Sign in'), onclick: open })]);
    door.replaceChildren(head, card);
    door.classList.toggle('over', !!held);
    door.hidden = false;
    const wait = setInterval(() => {
      if (!signedIn()) return;
      clearInterval(wait);
      then();
    }, 500);
  }
  // Orbit's home (Jay 2026-11-14: the settings-style list was "so ugly"): the
  // app to go on with as one card (something under way first, else the one
  // used last), the apps used lately, then the rest, each a slim row.
  const dayLine = () => {
    const at = { timeZone: 'Asia/Taipei' };
    const day = new Intl.DateTimeFormat(en ? 'en-US' : 'zh-TW', { ...at, month: 'long', day: 'numeric' }).format(new Date());
    const week = new Intl.DateTimeFormat(en ? 'en-US' : 'zh-TW', { ...at, weekday: 'long' }).format(new Date());
    return en ? `${week}, ${day}` : `${day} ${week}`;
  };
  const openApp = id => {
    const r = suite.resumeOf(suite.savedSuite(), id);
    hold({ url: r.url, y: r.y });
  };
  const role = id => BRANDS[id].role?.[lang] || '';
  function showList() {
    if (!signedIn()) return showSignIn(showList);
    const saved = suite.savedSuite();
    const now = Date.now();
    const live = new Set([...(suite.liveNow?.(suite.liveSaved?.() || {}, now) || []).map(x => x.app), ...(held?.tabs?.() || []).filter(x => x.live).map(x => x.app)]);
    const used = Object.entries(saved.apps || {})
      .filter(([id, v]) => BRANDS[id] && Number(v?.t) && now - Number(v.t) < 14 * 86_400_000)
      .sort((a, b) => Number(b[1].t) - Number(a[1].t))
      .map(([id]) => id);
    const first = [...live].find(id => BRANDS[id]) || used[0] || null;
    const recent = used.filter(id => id !== first).slice(0, 3);
    const rest = APP_ORDER.filter(id => id !== first && !recent.includes(id));
    const head = ui.h('header', { class: 'door-head' }, [ui.h('img', { src: './favicon.svg', alt: '' }), ui.h('div', {}, [ui.h('h1', { text: 'Orbit' }), ui.h('p', { text: dayLine() })])]);
    const row = id =>
      ui.h('button', { class: 'door-row', type: 'button', style: `--app:${BRANDS[id].color}`, onclick: () => openApp(id) }, [
        icon(id),
        ui.h('span', { class: 'door-name', text: BRANDS[id].short }),
        live.has(id) ? ui.h('span', { class: 'door-live', text: W('進行中', 'Under way') }) : ui.h('span', { class: 'door-role', text: role(id) }),
      ]);
    const group = (label, ids) => (ids.length ? ui.h('section', { class: 'door-group' }, [label ? ui.h('h2', { text: label }) : null, ui.h('div', { class: 'door-rows' }, ids.map(row))]) : null);
    const hero = first
      ? ui.h('button', { class: 'door-hero', type: 'button', style: `--app:${BRANDS[first].color}`, onclick: () => openApp(first), 'aria-label': `${BRANDS[first].short}，${live.has(first) ? W('進行中', 'under way') : W('上次用的', 'used last')}` }, [
          icon(first),
          ui.h('span', { class: 'door-hero-text' }, [
            live.has(first) ? ui.h('span', { class: 'door-live', text: W('進行中', 'Under way') }) : ui.h('span', { class: 'door-hero-kicker', text: W('接著用', 'Pick up') }),
            ui.h('span', { class: 'door-hero-name', text: BRANDS[first].short }),
            ui.h('span', { class: 'door-hero-role', text: role(first) }),
          ]),
          ui.h('span', { class: 'door-go', 'aria-hidden': 'true' }),
        ])
      : ui.h('p', { class: 'door-lead', text: W('選一個開始，下次打開會接著用。', 'Pick one to start; next time Orbit picks up there.') });
    door.replaceChildren(...[head, hero, group(W('最近', 'Recent'), recent), group(first || recent.length ? W('其他 App', 'More apps') : '', rest)].filter(Boolean));
    door.classList.toggle('over', !!held);
    door.hidden = false;
    door.scrollTop = 0;
  }
  if (!window.ORBIT_FIRST && isPhoneOrTablet() && !isStandalone()) {
    installGate('suite', lang, { name: 'Orbit', color: '#4f46e5', icon: './favicon.svg' });
  } else {
    suite.markSuite();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    // Opened after it was closed (no trail in this window yet), as an app
    // opens: the list, every app at its start, unless something is live
    // (Jay 2026-11-13: "keep where I was even if I closed it? weird"). A
    // return to an Orbit the phone kept is the host's (an hour's grace).
    let fresh = false;
    try {
      fresh = !sessionStorage.getItem('orbit.suite.trail');
    } catch {}
    if (fresh) {
      const saved = suite.savedSuite();
      for (const id of Object.keys(saved.apps || {})) saved.apps[id] = { ...saved.apps[id], url: saved.apps[id].home || null, y: 0 };
      try {
        localStorage.setItem('orbit.suite.v1', JSON.stringify(saved));
      } catch {}
    }
    const go = () => {
      const pick = /[?&#]pick\b/.test(location.href);
      const first = window.ORBIT_FIRST || (pick ? null : suite.launchTarget?.(suite.savedSuite(), suite.liveSaved?.() || {}, Date.now(), fresh ? 0 : undefined) || null);
      if (first) hold(first);
      else showList();
    };
    if (signedIn()) go();
    else showSignIn(go);
  }
</script>
</body>
</html>
