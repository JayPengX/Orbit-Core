<!-- Which Orbit this is (kit/orbit-mine.mjs): the tag in the address the
     home-screen icon opens (/app/?o=<tag>), kept for this window. Its name
     and icon go into the page before anything else reads it, so Add to Home
     Screen (and Chrome's install) take that Orbit's: its manifest is the
     proxy's, read from the tag (orbit-manifest.js). -->
<script>
!function () {
  try {
    var ss = sessionStorage, m = /[?&]o=([A-Za-z0-9_-]+)/.exec(location.search), tag = m ? m[1] : /[?&]o=/.test(location.search) ? '' : ss.getItem('orbit.which') || '';
    if (tag) ss.setItem('orbit.which', tag); else ss.removeItem('orbit.which');
    window.ORBIT_TAG = tag;
    if (!tag) return;
    var x = JSON.parse(decodeURIComponent(escape(atob(tag.replace(/-/g, '+').replace(/_/g, '/')))));
    var name = String(x.n || 'Orbit').slice(0, 20), look = /^[a-z-]+$/.test(x.l || '') ? x.l : 'night';
    // (An app's own look is its icon: kit/brand.mjs slugs.)
    var slug = { match: 'sports', orbit: 'class', vocab: 'words', stock: 'securities' }, app = /^app-([a-z]+)$/.exec(look);
    var apple = app ? '/' + (slug[app[1]] || app[1]) + '/icons/apple-touch-icon.png' : '/app/looks/' + look + '/apple.png';
    var set = function (sel, attr, v) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, v); };
    set('link[rel="manifest"]', 'href', '/api/orbit-manifest?o=' + tag);
    set('link[rel="apple-touch-icon"]', 'href', apple);
    set('meta[name="apple-mobile-web-app-title"]', 'content', name);
    set('meta[name="application-name"]', 'content', name);
    document.title = name;
  } catch (e) {}
}();
</script>

<!-- Orbit: every app in one home-screen app (Orbit-Core kit/suite.mjs). This
     page is Orbit's window: each app opened is held in a frame of its own
     (kit suite.mjs host), kept running while another is shown. Opened from
     the icon it goes on with the app used last, where it was left (the
     module below picks it: suite.mjs launchTarget, something live first);
     else, and the first time, it lists the apps; in a phone's browser, it
     shows how to add Orbit to the home screen. The keys are suite.mjs's. -->
<script>
!function () {
  try {
    var ss = sessionStorage, ls = localStorage, nav = navigator, ua = nav.userAgent || '';
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || nav.standalone === true;
    var touch = /iPhone|iPad|iPod|Android/i.test(ua) || (/Macintosh/.test(ua) && nav.maxTouchPoints > 1);
    // (A phone's browser: added to the home screen first. Another app's own window: not Orbit's.)
    if ((touch && !standalone) || (standalone && ss.getItem('orbit.window') && ss.getItem('orbit.suite') !== '1')) return;
    ss.setItem('orbit.suite', '1');
    var s = JSON.parse(ls.getItem('orbit.suite.v1') || 'null') || { apps: {} };
    s.on = 1;
    s.t = s.t || Date.now();
    ls.setItem('orbit.suite.v1', JSON.stringify(s));
    var open = /[?&]open=([^&#]+)/.exec(location.search);
    if (open) window.ORBIT_FIRST = { url: decodeURIComponent(open[1]), y: 0 };
  } catch (e) {}
}();
</script>

<script type="module">
  const [{ installGate, isPhoneOrTablet, isStandalone, detectLang, storedAccount, orbitSession, accountSheet, signInScreen }, ui, { APP_ORDER, BRANDS, appIcon, pathOf }, suite] = await Promise.all([import('#kit/orbit.mjs'), import('#kit/ui.mjs'), import('#kit/brand.mjs'), import('#kit/suite.mjs')]);
  const brand = await import('#kit/brand.mjs');
  // This Orbit (kit/orbit-mine.mjs): its name, look and apps. (An older kit without it: every app, as before.)
  const mine = await import('#kit/orbit-mine.mjs').catch(() => null);
  const tag = window.ORBIT_TAG || '';
  const setup = mine?.setupOf ? mine.setupOf(tag) : { name: 'Orbit', apps: [...APP_ORDER], look: 'night' };
  const myApps = () => (mine?.appsOf ? mine.appsOf(tag) : [...APP_ORDER]);
  const lookSrc = look => `data:image/svg+xml,${encodeURIComponent(brand.orbitIcon ? brand.orbitIcon(look) : brand.familyMark())}`;
  const myIcon = lookSrc(setup.look);
  const lang = detectLang();
  const en = lang === 'en';
  if (en) document.documentElement.lang = 'en';
  const W = (zh, e) => (en ? e : zh);
  const door = document.getElementById('door');
  let held = null;
  const hold = first => {
    door.hidden = true;
    document.documentElement.classList.add('q-suite-host');
    // (Should the phone move it anyway, as a field is focused: put back.)
    addEventListener('scroll', () => (scrollX || scrollY) && scrollTo(0, 0), { passive: true });
    const app = suite.appAt?.(new URL(first.url, location.href).pathname);
    // (An older kit without the host: on to the app as before.)
    if (!suite.host || !app) return void location.assign(first.url);
    if (held) return void held.go(app, first.url);
    try {
      sessionStorage.setItem('orbit.launch', String(Date.now()));
    } catch {}
    held = suite.host(document.getElementById('frames'), { first: { ...first, app }, list: () => (myApps().length === 1 ? openApp(myApps()[0]) : showList()), onShow: id => addressOf(id), mine: myApps });
  };
  // The list of apps, the one used last on top (over the apps held, on a return).
  const icon = id => Object.assign(document.createElement('img'), { className: 'door-icon', src: `data:image/svg+xml,${encodeURIComponent(appIcon(id, { crisp: true }))}`, alt: '' });
  // Signed in first (Jay 2026-11-13): Orbit is the Pass's, one sign-in for every app.
  const signedIn = () => !storedAccount || !!storedAccount();
  let session = null;
  // Signed out (Jay 2026-11-14: 登入 opened the Pass's settings, and the page
  // was "so plain and empty"): the sign-in itself, at once, with Orbit's apps
  // circling its mark: what one Pass opens. No pass is made here: the owner
  // hands them out (eco.js ecoCreate), so the screen says where to get one.
  const orbitRing = () => {
    const ring = ui.h('div', { class: 'door-ring', 'aria-hidden': 'true' }, [ui.h('img', { class: 'door-ring-core', src: myIcon, alt: '' }), ui.h('div', { class: 'door-ring-path' })]);
    const spin = ui.h('div', { class: 'door-ring-spin' });
    const ringApps = myApps();
    ringApps.forEach((id, i) => {
      const at = ui.h('span', { class: 'door-ring-at', style: `--a:${(360 / ringApps.length) * i}deg` });
      at.append(Object.assign(icon(id), { className: 'door-ring-icon' }));
      spin.append(at);
    });
    ring.append(spin);
    return ring;
  };
  function showSignIn(then) {
    session ||= orbitSession(suite.lastApp?.(suite.savedSuite()) || myApps()[0], { lang });
    let over = false;
    const go = () => {
      if (over) return;
      over = true;
      clearInterval(wait);
      document.documentElement.classList.remove('q-signing-in');
      then();
    };
    // (Signed in in another tab, or here: on to the apps.)
    const wait = setInterval(() => signedIn() && go(), 500);
    if (signInScreen) {
      door.hidden = true;
      signInScreen(session, { hero: orbitRing(), title: setup.name, lede: W('十個 App，一個 Orbit Pass。', 'Ten apps, one Orbit Pass.'), accent: '#5e5ce6' }).then(go, () => {});
      return;
    }
    // (An older kit, without the sign-in on its own: its Pass sheet, as before.)
    const head = ui.h('header', { class: 'door-head' }, [ui.h('img', { src: './favicon.svg', alt: '' }), ui.h('div', {}, [ui.h('h1', { text: 'Orbit' }), ui.h('p', { text: W('登入一次，每個 App 都一起登入', 'Sign in once, for every app') })])]);
    const card = ui.h('div', { class: 'door-sign' }, [ui.h('h2', { text: W('登入 Orbit Pass', 'Sign in to Orbit Pass') }), ui.h('button', { class: 'q-btn primary block', type: 'button', text: W('登入', 'Sign in'), onclick: () => accountSheet(session) })]);
    door.replaceChildren(head, card);
    door.classList.toggle('over', !!held);
    door.hidden = false;
  }
  // Orbit's home (Jay 2026-11-14: the settings-style list was "so ugly"): the
  // app to go on with as one card (something under way first, else the one
  // used last), the apps used lately, then the rest, each a slim row.
  const dayLine = () => {
    const at = { timeZone: 'Asia/Taipei' };
    const day = new Intl.DateTimeFormat(en ? 'en-US' : 'zh-TW', { ...at, month: 'long', day: 'numeric' }).format(new Date());
    const week = new Intl.DateTimeFormat(en ? 'en-US' : 'zh-TW', { ...at, weekday: 'long' }).format(new Date());
    return en ? `${week}, ${day}` : `${day} ${week}`;
  };
  const openApp = id => {
    const r = suite.resumeOf(suite.savedSuite(), id);
    hold({ url: r.url, y: r.y });
  };
  // (Something under way: shown in full, docs/ORBIT.md rule 8.)
  const openLive = id => {
    if (held?.full) return void ((door.hidden = true), held.full(id));
    try {
      sessionStorage.setItem(suite.FULL_KEY || 'orbit.suite.full', JSON.stringify({ app: id, t: Date.now() }));
    } catch {}
    hold({ url: pathOf(id), y: 0 });
  };
  const role = id => BRANDS[id].role?.[lang] || '';
  function showList() {
    if (!signedIn()) return showSignIn(showList);
    const saved = suite.savedSuite();
    const now = Date.now();
    const live = new Set([...(suite.liveNow?.(suite.liveSaved?.() || {}, now) || []).map(x => x.app), ...(held?.tabs?.() || []).filter(x => x.live).map(x => x.app)]);
    const used = Object.entries(saved.apps || {})
      .filter(([id, v]) => BRANDS[id] && Number(v?.t) && now - Number(v.t) < 14 * 86_400_000)
      .sort((a, b) => Number(b[1].t) - Number(a[1].t))
      .map(([id]) => id);
    // (This Orbit's apps only, and anything under way in another.)
    const apps = myApps();
    const first = [...live].find(id => BRANDS[id]) || used.find(id => apps.includes(id)) || null;
    const recent = used.filter(id => id !== first && apps.includes(id)).slice(0, 3);
    const rest = apps.filter(id => id !== first && !recent.includes(id));
    const head = ui.h('header', { class: 'door-head' }, [ui.h('img', { src: myIcon, alt: '' }), ui.h('div', {}, [ui.h('h1', { text: setup.name }), ui.h('p', { text: dayLine() })])]);
    const row = id =>
      ui.h('button', { class: 'door-row', type: 'button', style: `--app:${BRANDS[id].color}`, onclick: () => (live.has(id) ? openLive(id) : openApp(id)) }, [
        icon(id),
        ui.h('span', { class: 'door-name', text: BRANDS[id].short }),
        live.has(id) ? ui.h('span', { class: 'door-live', text: W('進行中', 'Under way') }) : ui.h('span', { class: 'door-role', text: role(id) }),
      ]);
    const group = (label, ids) => (ids.length ? ui.h('section', { class: 'door-group' }, [label ? ui.h('h2', { text: label }) : null, ui.h('div', { class: 'door-rows' }, ids.map(row))]) : null);
    const hero = first
      ? ui.h('button', { class: 'door-hero', type: 'button', style: `--app:${BRANDS[first].color}`, onclick: () => (live.has(first) ? openLive(first) : openApp(first)), 'aria-label': `${BRANDS[first].short}，${live.has(first) ? W('進行中', 'under way') : W('上次用的', 'used last')}` }, [
          icon(first),
          ui.h('span', { class: 'door-hero-text' }, [
            live.has(first) ? ui.h('span', { class: 'door-live', text: W('進行中', 'Under way') }) : ui.h('span', { class: 'door-hero-kicker', text: W('接著用', 'Pick up') }),
            ui.h('span', { class: 'door-hero-name', text: BRANDS[first].short }),
            ui.h('span', { class: 'door-hero-role', text: role(first) }),
          ]),
          ui.h('span', { class: 'door-go', 'aria-hidden': 'true' }),
        ])
      : ui.h('p', { class: 'door-lead', text: W('選一個開始，下次打開會接著用。', 'Pick one to start; next time Orbit picks up there.') });
    const edit = mine?.setApps ? ui.h('button', { class: 'door-edit', type: 'button', text: W('選擇這個 Orbit 裡的 App', 'Choose the apps in this Orbit'), onclick: () => editApps() }) : null;
    door.replaceChildren(...[head, hero, group(W('最近', 'Recent'), recent), group(first || recent.length ? W('其他 App', 'More apps') : '', rest), edit].filter(Boolean));
    if (held) addressOf(null);
    door.classList.toggle('over', !!held);
    door.hidden = false;
    door.scrollTop = 0;
  }
  // The address says the app in use, or / for Orbit's home (Jay 2026-11-14:
  // "can't an orbit just go /sports when they switch to sports"): this page
  // stays, only its address changes. A reload there comes back into this
  // Orbit (kit suite.mjs start, orbit.addr; the home page forwards an
  // installed app's window here).
  const onDomain = (await import('#kit/domain.mjs').catch(() => ({}))).onDomain;
  function addressOf(id) {
    if (!onDomain) return;
    const to = id ? pathOf(id) : '/';
    try {
      sessionStorage.setItem('orbit.addr', to);
      if (location.pathname !== to) history.replaceState(history.state, '', to);
    } catch {}
    document.title = setup.name;
  }

  // Which apps are in this Orbit, changed inside it (kit orbit-mine.mjs setApps; the Pass keeps it too).
  function appTiles(chosen, onChange) {
    const grid = ui.h('div', { class: 'o-apps', role: 'group', 'aria-label': W('App', 'Apps') });
    for (const id of APP_ORDER) {
      const b = ui.h('button', { class: 'o-app', type: 'button', 'aria-pressed': String(chosen.has(id)), style: `--app:${BRANDS[id].color}` }, [Object.assign(icon(id), { className: 'o-app-icon' }), ui.h('span', { class: 'o-app-name', text: BRANDS[id].short }), ui.h('span', { class: 'o-check', 'aria-hidden': 'true' })]);
      b.onclick = () => {
        // (At least one app: the last one stays.)
        if (chosen.has(id) && chosen.size === 1) return;
        chosen.has(id) ? chosen.delete(id) : chosen.add(id);
        b.setAttribute('aria-pressed', String(chosen.has(id)));
        onChange?.();
      };
      grid.append(b);
    }
    return grid;
  }
  function editApps() {
    const chosen = new Set(myApps());
    const done = ui.h('button', { class: 'q-btn primary block', type: 'button', text: W('完成', 'Done') });
    const s = ui.sheet({ title: W('這個 Orbit 裡的 App', 'Apps in this Orbit'), cls: 'o-sheet', body: [ui.h('p', { class: 'o-note', text: W('選一個，打開就直接是那個 App。名稱和圖示在加入主畫面時就定好了。', 'Pick one and Orbit opens straight into it. The name and icon were set when it was added.') }), appTiles(chosen)], foot: ui.h('div', { class: 'o-foot' }, [done]) });
    done.onclick = () => {
      mine.setApps(tag, [...chosen]);
      s.close?.();
      showList();
    };
  }
  // (Changed on another device, through the Pass: drawn again.)
  addEventListener('orbit-mine', () => !door.hidden && showList());
  addEventListener('storage', e => e.key === mine?.MINE_KEY && !door.hidden && showList());

  // ---- Before it's added: the steps, and setup (optional) ----
  // Jay 2026-11-14: decide which apps are in the Orbit and pick its icon
  // before adding it, "plenty to choose from", but never required: the steps
  // work at once for every app, the name Orbit, the first look. Setup swaps
  // the gate's box for its own panel; 完成 opens this page again with the
  // new tag, so the phone takes that name and icon (the head's script).
  function setupPanel(box) {
    const plainName = apps => (apps.size === 1 ? BRANDS[[...apps][0]].short : 'Orbit');
    const chosen = new Set(setup.apps);
    let look = setup.look;
    let lookPicked = !!tag && look !== (mine.defaultLook?.([...chosen]) ?? look);
    let named = !!tag && setup.name !== plainName(chosen);
    const preview = ui.h('img', { class: 'o-preview-icon', alt: '' });
    const label = ui.h('span', { class: 'o-preview-name' });
    const name = ui.h('input', { class: 'o-name', type: 'text', maxlength: String(mine.NAME_MAX || 20), enterkeyhint: 'done', autocomplete: 'off', 'aria-label': W('名稱', 'Name') });
    name.value = setup.name;
    const looks = ui.h('div', { class: 'o-looks', role: 'radiogroup', 'aria-label': W('圖示', 'Icon') });
    const lookButtons = new Map();
    const draw = () => {
      if (!named) name.value = plainName(chosen);
      if (!lookPicked) look = mine.defaultLook([...chosen]);
      preview.src = lookSrc(look);
      label.textContent = name.value.trim() || plainName(chosen);
      for (const [l, b] of lookButtons) b.setAttribute('aria-checked', String(l === look));
    };
    name.addEventListener('input', () => ((named = name.value.trim() !== ''), draw()));
    name.addEventListener('keydown', e => e.key === 'Enter' && name.blur());
    const lookGroup = (title, list) => {
      const g = ui.h('div', { class: 'o-look-grid' });
      for (const l of list) {
        const b = ui.h('button', { class: 'o-look', type: 'button', role: 'radio', 'aria-label': brand.lookName(l, lang), title: brand.lookName(l, lang) }, [ui.h('img', { src: lookSrc(l), alt: '', loading: 'lazy' })]);
        b.onclick = () => ((look = l), (lookPicked = true), draw());
        lookButtons.set(l, b);
        g.append(b);
      }
      return [ui.h('h4', { class: 'o-sub', text: title }), g];
    };
    const LOOKS = brand.LOOKS || [];
    looks.append(...lookGroup(W('彩色衛星', 'Coloured moons'), LOOKS.filter(l => !brand.lookApp(l) && !/-white$/.test(l))), ...lookGroup(W('白色衛星', 'White moons'), LOOKS.filter(l => /-white$/.test(l))), ...lookGroup(W('App 的圖示', 'An app’s icon'), LOOKS.filter(l => brand.lookApp(l))));
    const finish = () => {
      const next = mine.encodeSetup({ name: name.value.trim() || plainName(chosen), apps: [...chosen], look });
      try {
        if (!next) sessionStorage.removeItem('orbit.which');
      } catch {}
      location.replace(mine.startOf(next) + (next ? '' : '?o='));
    };
    const reset = ui.h('button', { class: 'o-reset', type: 'button', text: W('還原成預設：全部 App', 'Back to the default: every app'), onclick: () => (chosen.clear(), APP_ORDER.forEach(id => chosen.add(id)), (named = false), (lookPicked = false), panel.querySelectorAll('.o-app').forEach(b => b.setAttribute('aria-pressed', 'true')), draw()) });
    const panel = ui.h('div', { class: 'o-setup' }, [
      ui.h('div', { class: 'o-setup-bar' }, [ui.h('button', { class: 'o-cancel', type: 'button', text: W('取消', 'Cancel'), onclick: () => box.classList.remove('o-setting') }), ui.h('h2', { text: W('自訂 Orbit', 'Customize Orbit') }), ui.h('button', { class: 'o-done', type: 'button', text: W('完成', 'Done'), onclick: finish })]),
      ui.h('div', { class: 'o-preview' }, [preview, label]),
      ui.h('h3', { class: 'o-head', text: W('名稱', 'Name') }),
      name,
      ui.h('h3', { class: 'o-head', text: W('App', 'Apps') }),
      ui.h('p', { class: 'o-note', text: W('只選一個，就是只有那個 App 的 Orbit。主畫面可以放好幾個 Orbit。', 'Pick just one for an Orbit of that app alone. A home screen can hold several Orbits.') }),
      appTiles(chosen, draw),
      ui.h('h3', { class: 'o-head', text: W('圖示', 'Icon') }),
      looks,
      ui.h('button', { class: 'q-btn primary block o-finish', type: 'button', text: W('完成', 'Done'), onclick: finish }),
      reset
    ]);
    draw();
    return panel;
  }

  if (!window.ORBIT_FIRST && isPhoneOrTablet() && !isStandalone()) {
    // (Set up already: what was picked, and a way back to it.)
    const picked = tag ? `${setup.apps.length === APP_ORDER.length ? W('全部 App', 'Every app') : setup.apps.map(id => BRANDS[id].short).join('、')}` : '';
    // (A one-app Orbit a separate app sent here, as it came: nothing chosen yet.)
    const asIs = !!tag && !!mine?.cleanSetup && JSON.stringify(mine.cleanSetup({ apps: setup.apps })) === JSON.stringify(setup);
    const more = mine?.encodeSetup && brand.LOOKS
      ? ui.h('button', { class: 'o-custom', type: 'button' }, [ui.h('span', { class: 'o-custom-text' }, [ui.h('strong', { text: tag && !asIs ? W('已自訂', 'Customized') : W('自訂名稱、App 和圖示', 'Choose its name, apps and icon') }), ui.h('small', { text: tag ? picked : W('可以不用，直接加入就是全部 App', 'Optional: added as it is, it holds every app') })]), ui.h('span', { class: 'o-custom-go', 'aria-hidden': 'true' })])
      : null;
    installGate('suite', lang, { name: setup.name, color: brand.lookApp?.(setup.look) ? brand.lookColor(setup.look) : '#5e5ce6', icon: myIcon, more });
    if (more) {
      more.onclick = () => {
        const box = more.closest('.q-gate-box');
        if (!box) return;
        box.querySelector('.o-setup')?.remove();
        box.append(setupPanel(box));
        box.classList.add('o-setting');
        box.scrollTop = 0;
        box.closest('dialog')?.scrollTo?.(0, 0);
      };
      if (/#setup\b/.test(location.hash)) more.onclick();
    }
    // (The address keeps its tag here, on the add page alone: a phone that
    // takes the page's address rather than the manifest's start at Add to
    // Home Screen still gets this Orbit, and a reload keeps the setup.)
  } else {
    suite.markSuite();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    document.title = setup.name;
    // Opened after it was closed (no trail in this window yet), as an app
    // opens: the list, every app at its start, unless something is live
    // (Jay 2026-11-13: "keep where I was even if I closed it? weird"). A
    // return to an Orbit the phone kept is the host's (an hour's grace).
    let fresh = false;
    try {
      fresh = !sessionStorage.getItem('orbit.suite.trail');
    } catch {}
    if (fresh) {
      const saved = suite.savedSuite();
      // (With something under way, the app looked at last is kept as it was: docs/ORBIT.md rule 3.)
      const live = (suite.liveNow?.(suite.liveSaved?.() || {}) || []).length > 0;
      const keep = live ? (BRANDS[saved.last] && saved.last) || suite.lastApp?.(saved) : null;
      for (const id of Object.keys(saved.apps || {})) if (id !== keep) saved.apps[id] = { ...saved.apps[id], url: saved.apps[id].home || null, y: 0 };
      try {
        localStorage.setItem('orbit.suite.v1', JSON.stringify(saved));
      } catch {}
    }
    const go = () => {
      const pick = /[?&#]pick\b/.test(location.href);
      const apps = myApps();
      let first = window.ORBIT_FIRST || (pick ? null : suite.launchTarget?.(suite.savedSuite(), suite.liveSaved?.() || {}, Date.now(), fresh ? 0 : undefined) || null);
      // (Another Orbit's app, on a phone whose Orbits share storage: this one's home instead, unless it's under way.)
      if (first && !window.ORBIT_FIRST && !apps.includes(suite.appAt?.(new URL(first.url, location.href).pathname)) && !(suite.liveNow?.(suite.liveSaved?.() || {}) || []).some(x => first.url?.startsWith(pathOf(x.app)))) first = null;
      // (A one-app Orbit: that app, always.)
      if (!first && apps.length === 1) first = { url: suite.resumeOf(suite.savedSuite(), apps[0]).url, y: 0 };
      if (first) hold(first);
      else (showList(), addressOf(null));
    };
    if (signedIn()) go();
    else showSignIn(go);
  }
</script>
</body>
</html>
