<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheet drag test</title>
<link rel="stylesheet" href="../kit/quadra.css">
<style>
  /* A side-by-side of a sheet's drag on a phone: A the kit's own (the
     finger moved by script, quadra.mjs sheetSwipe), B moved by Safari's own
     scrolling (scroll snap: open, or gone at the foot). */
  body { margin: 0; background: var(--q-bg, #f2f2f7); color: var(--q-label, #000); font-family: var(--q-font, -apple-system, system-ui, sans-serif); }
  main { padding: calc(env(safe-area-inset-top) + 16px) 16px 40px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  p.note { color: var(--q-label-2, #666); font-size: 15px; margin: 0 0 16px; }
  .open { display: block; width: 100%; margin: 0 0 12px; padding: 16px; border: 0; border-radius: 14px; background: var(--q-accent, #0a84ff); color: #fff; font: 600 17px/1.2 inherit; text-align: left; }
  .open small { display: block; font-weight: 400; opacity: 0.85; margin-top: 4px; }
  .row { padding: 14px 0; border-bottom: 0.5px solid var(--q-separator, rgba(60, 60, 67, 0.29)); font-size: 16px; }
  .filler .row { color: var(--q-label-2, #666); }

  /* B: the dimming, the scroller over the whole screen, and the sheet at its foot. */
  .ns-dim { position: fixed; inset: 0; z-index: 50; background: var(--q-dim, rgba(0, 0, 0, 0.3)); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .ns-dim.on { opacity: 1; }
  .ns { position: fixed; inset: 0; z-index: 51; overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y mandatory; scrollbar-width: none; display: none; }
  .ns::-webkit-scrollbar { display: none; }
  .ns.on { display: block; }
  .ns-gap { height: 100dvh; scroll-snap-align: start; }
  .ns-sheet { scroll-snap-align: end; scroll-margin-bottom: 8px; width: calc(100vw - 16px); max-height: calc(100dvh - env(safe-area-inset-top) - 24px); margin: 0 auto 8px; box-sizing: border-box; border-radius: var(--q-r-sheet, 34px); background: var(--q-sheet, #fff); box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22); display: flex; flex-direction: column; overflow: hidden; }
  .ns-sheet .grab { flex: none; width: 36px; height: 5px; margin: 6px auto 0; border-radius: 3px; background: var(--q-label-3, rgba(60, 60, 67, 0.3)); }
  .ns-sheet .head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  .ns-sheet .head h2 { margin: 0; font-size: 17px; }
  .ns-sheet .body { overflow-y: auto; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
  .ns-tail { height: 1px; }
</style>
</head>
<body>
<main>
  <h1>拖曳測試</h1>
  <p class="note">兩張卡片內容一樣。各打開一次，按住往下拉、拉一半放開、快速往下滑，比較哪一張跟手。</p>
  <button class="open" type="button" id="openA">A · 目前的卡片<small>腳本跟著手指移動（現在每個 app 用的）</small></button>
  <button class="open" type="button" id="openB">B · 原生捲動<small>由 Safari 自己的捲動移動卡片</small></button>
  <div class="filler" id="filler"></div>
</main>

<dialog class="q-sheet" id="sheetA">
  <div class="q-sheet-head"><span></span><h2>A · 目前的卡片</h2><button class="q-close" type="button" aria-label="關閉" id="closeA">✕</button></div>
  <div id="listA"></div>
</dialog>

<div class="ns-dim" id="dimB"></div>
<div class="ns" id="sheetB">
  <div class="ns-gap"></div>
  <div class="ns-sheet">
    <div class="grab"></div>
    <div class="head"><span></span><h2>B · 原生捲動</h2><button class="q-close" type="button" aria-label="關閉" id="closeB">✕</button></div>
    <div class="body" id="listB"></div>
  </div>
</div>

<!-- The built kit's modules import each other as #kit/… (kit/stamp.mjs). -->
<script type="importmap">{"imports":{"#kit/":"../kit/"}}</script>
<script type="module">
  import { closeSheet } from '../kit/quadra.mjs';
  const rows = (n, word) => Array.from({ length: n }, (_, i) => `<div class="row">${word} ${i + 1}</div>`).join('');
  document.getElementById('filler').innerHTML = rows(30, '背後的頁面');
  document.getElementById('listA').innerHTML = rows(40, '內容');
  document.getElementById('listB').innerHTML = rows(40, '內容');

  // A: the kit's sheet, as every app opens it.
  const a = document.getElementById('sheetA');
  document.getElementById('openA').onclick = () => a.showModal();
  document.getElementById('closeA').onclick = () => closeSheet(a);
  a.addEventListener('click', e => e.target === a && closeSheet(a));

  // B: open is the scroller at its foot (the sheet in view); the sheet
  // pulled down is the scroller going up, by the finger, at the screen's own
  // rate; let go, it snaps open or to the top (the sheet gone) and closes.
  const b = document.getElementById('sheetB');
  const dim = document.getElementById('dimB');
  const foot = () => b.scrollHeight - b.clientHeight;
  let closing = false;
  const shut = () => {
    closing = true;
    b.scrollTo({ top: 0, behavior: 'smooth' });
  };
  document.getElementById('openB').onclick = () => {
    closing = false;
    b.classList.add('on');
    dim.classList.add('on');
    document.documentElement.style.overflow = 'hidden';
    b.scrollTop = 0;
    requestAnimationFrame(() => b.scrollTo({ top: foot(), behavior: 'smooth' }));
  };
  document.getElementById('closeB').onclick = shut;
  b.querySelector('.ns-gap').onclick = shut;
  // The dimming follows the sheet; at the top (nothing of it left), it's closed.
  b.addEventListener('scroll', () => {
    const shown = foot() ? b.scrollTop / foot() : 0;
    dim.style.opacity = String(Math.min(1, shown * 1.4));
    if (b.scrollTop <= 1 && b.classList.contains('on') && (closing || !b.matches(':active'))) {
      clearTimeout(b.__end);
      b.__end = setTimeout(() => {
        if (b.scrollTop > 1) return;
        b.classList.remove('on');
        dim.classList.remove('on');
        dim.style.opacity = '';
        document.documentElement.style.overflow = '';
      }, 80);
    }
  }, { passive: true });
</script>
</body>
</html>
