# Deploys sports-proxy-worker.js as its OWN Cloudflare Worker, separate
# from wrangler.toml's "orbit-workers-proxy" - see sports-proxy-worker.js's
# top comment for why it can't share that Worker's [placement] region pin.
#
# CI deploys this on every push to main (see .github/workflows/deploy.yml).
# Manual deploy:
#   npx wrangler deploy -c wrangler.sports-proxy.toml
name = "sports-proxy"
main = "sports-proxy-worker.js"
compatibility_date = "2025-01-01"

# Deliberately no [placement] block: Cloudflare's default runs each
# request's isolate at whichever colo received it, i.e. near the caller.

# No KV binding: this Worker counts requests per Quadra Pass session in
# memory (quadra-token.js sessionLimited) and keeps nothing in KV.


# A local dev page (the preview tool) may read without a Quadra Pass,
# rate-limited (sports-proxy-worker.js checkSession). "off" closes it.
[vars]
SPORTS_DEV = "on"

# The main Worker, called directly (a workers.dev address can't be fetched
# from another Worker): the developer settings (GET /config) the cache times
# here follow.
[[services]]
binding = "ORBIT"
service = "orbit-workers-proxy"
