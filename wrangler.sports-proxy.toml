# The old sports proxy's address, now only a forwarder (sports-forward.js):
# the main Worker (wrangler.toml, "orbit-workers-proxy") serves /sports-proxy
# itself since 2026-10-13 (the owner: one proxy). Kept for phones still on a
# kit from before the move; removed once every device has moved on.
#
# CI deploys this on every push to main (see .github/workflows/deploy.yml).
# Manual deploy:
#   npx wrangler deploy -c wrangler.sports-proxy.toml
name = "sports-proxy"
main = "sports-forward.js"
compatibility_date = "2025-01-01"

# The main Worker, called directly (a workers.dev address can't be fetched
# from another Worker; a call over a service binding isn't a billed request).
[[services]]
binding = "ORBIT"
service = "orbit-workers-proxy"

# The F1 lap log moved to the main Worker: this one's class is deleted (its
# fortnight of past sessions isn't needed: F1's archive has them).
[[migrations]]
tag = "f1-log-1"
new_sqlite_classes = ["F1Log"]

[[migrations]]
tag = "f1-log-2"
deleted_classes = ["F1Log"]

# No crons: the F1 lap log's minute runs on the main Worker.
[triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 0.05

[limits]
cpu_ms = 100
