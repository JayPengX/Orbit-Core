# The hard stop on Cloudflare's bill (guard.js): reads the account's use
# every five minutes, paces the month (guard:pace, pace.js) and takes the
# proxy off the air before anything passes the $5 Workers Paid plan's
# included amounts, until the next period.
#
# CI deploys it when its own files change (.github/workflows/deploy-guard.yml),
# with one secret from the repo's: CF_GUARD_TOKEN (an API token the owner
# makes: Account Analytics Read + Workers Scripts Edit); the account is the
# token's own. Manual deploy:
#   npx wrangler deploy -c wrangler.guard.toml
name = "quota-guard"
main = "guard-worker.js"
compatibility_date = "2025-01-01"

# No address: it only runs on its cron.
workers_dev = false
preview_urls = false

[vars]
# The day of the month the plan renews (Cloudflare dashboard → Billing). The
# period is counted from the day before it, so a day off only counts more.
PERIOD_DAY = "13"
# Stop at 90% of any included amount (analytics' counts are estimates).
STOP_AT = "0.9"

# Its state (guard:state), read by the admin panel's 容量 through the main Worker.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b24d75fbe0a4a69aef0f35cb7a8d847"

[limits]
cpu_ms = 1000

[observability]
enabled = true

# Its clock: a Durable Object's alarm every five minutes (guard-worker.js
# GuardClock): the cron below was registered and never ran (2026-10-13).
[[durable_objects.bindings]]
name = "CLOCK"
class_name = "GuardClock"

[[migrations]]
tag = "clock-1"
new_sqlite_classes = ["GuardClock"]

[triggers]
crons = ["*/5 * * * *"]
