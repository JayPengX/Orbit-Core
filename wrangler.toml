# The proxy's Worker. deploy.yml deploys this file with Wrangler on every
# push to main that touches what the Workers run (*.js, builders/, kit/,
# locales/, either wrangler toml). A deploy pushes THIS FILE's [vars] and
# bindings as the Worker's whole config, replacing whatever is live on
# Cloudflare: it does not merge with dashboard-made changes. Secrets
# (GEMINI_API_KEY, ECO_TOKEN_SECRET, …) are stored separately, set in the
# dashboard or with `wrangler secret put`, and a deploy never touches them.
name = "orbit-workers-proxy"
# ^ Must match the Worker's actual name in the Cloudflare dashboard exactly -
# `wrangler deploy` targets whatever's named here, and a mismatch silently
# creates/updates an unrelated second Worker instead of erroring. This is
# the live Worker's name from before this code moved into its own repo,
# kept unchanged on purpose - not a sign this is still Orbit-specific.
main = "worker.js"
compatibility_date = "2025-01-01"
# AsyncLocalStorage (node:async_hooks) for the Runner's count of each
# invocation's outside calls (runner.js).
compatibility_flags = ["nodejs_als"]

# The proxy at the apps' own address too (kit/domain.mjs API): orbit.<domain>/api/…
# and the bare domain's (the showcase); worker.js viaSite takes /api off.
# One connection for an app and its server, no CORS preflight. api.<domain>
# stays (old kits): deploy.yml attaches it. guard.js takes all of them off
# with the proxy, and deploy.yml keeps them off while it's stopped.
# (Kept on with the routes, which turn it off by default: old kits and local
# previews call orbit-workers-proxy.<account>.workers.dev.)
workers_dev = true
routes = [
  { pattern = "orbit.jaypengx.com/api/*", zone_name = "jaypengx.com" },
  { pattern = "jaypengx.com/api/*", zone_name = "jaypengx.com" }
]

# No [placement]: the proxy runs at the colo each request comes in through,
# near the caller. It was pinned to Taiwan (gcp:asia-east1) for Gemini (which
# refuses Hong Kong, where Smart Placement and some callers' colos land) and
# for TDX and CWA; pinned whole, Yahoo turned most of its reads away
# (2026-10-14: Taiwan's placement 11 of 16 refused, no placement 0 of 8), and
# every Securities price and fill goes through Yahoo. So Gemini alone goes
# through a relay pinned to Taiwan (gemini-relay.js, the service binding
# GEMINI_RELAY below), as Cloudflare advises for one part that must run
# somewhere.
[[services]]
binding = "GEMINI_RELAY"
service = "gemini-relay"

# Orbit Law's site (the orbit-law Worker's files, deploy/cf-site.mjs): its
# data, read by /law-* (law.js readData). Its route on our own zone can't be
# fetched from here.
[[services]]
binding = "LAW_SITE"
service = "orbit-law"

[vars]
# Orbit Transit (transit.js): TDX calls a minute this Worker allows itself.
# The owner is on a paid TDX plan (5 a second at least): 4 a second.
TDX_PER_MIN = "240"
# …and a second: calls wait their turn, 4 a second (TDX refuses past 5).
TDX_PER_SEC = "4"
# A local dev page (the preview's --live) may ask for transit data without a
# Orbit Pass, rate-limited (worker.js). "off" closes it.
TRANSIT_DEV = "on"
# Weather's the same (worker.js): the forecast and the place from a local
# page, 30 a minute an address. "off" closes it.
WEATHER_DEV = "on"
# The sports proxy's dev door (sports.js checkSession): a local
# page may read without a Orbit Pass, rate-limited. "off" closes it.
SPORTS_DEV = "on"
# The Runner (runner.js): heavy routes and the crons' work in a Durable
# Object ("on"), or in the Worker as before ("off"; the paid plan's 30 s).
RUNNER_ROUTES = "on"
RUNNER_CRONS = "on"

# GEMINI_API_KEY (for /gemini and /nl-edit) and ECO_TOKEN_SECRET
# (the Pass's sign-ins) are Secrets, not [vars] (the dashboard's Settings ->
# Variables and Secrets). The Pass's
# store is D1 (doc-store.js; the [[d1_databases]] binding STORE is added by
# deploy.yml). FIREBASE_PRIVATE_KEY stays a secret only until 2026-12-05:
# sign-ins made before ECO_TOKEN_SECRET (2026-10-05, 60 days) were signed
# with a key made from it (orbit-token.js); deploy.yml removes it then.

# Workers KV: what has to outlive an isolate and be seen by the crons:
# push subscriptions (push.js), Orbit Transit's monthly Google meter and TDX
# token (transit.js), Orbit Weather's daily Google count, its scoring and an
# hourly copy of each cell (weather.js, weather-skill.js), Orbit Law's answers
# (law.js). Not rate limits:
# those are in memory (worker.js), and caches are in Cloudflare's cache, so
# the plan's million writes a month stay far off.

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b24d75fbe0a4a69aef0f35cb7a8d847"

# Keeps console.log output (e.g. worker.js's gemini_usage token counts) in
# the Cloudflare dashboard's Workers Logs, instead of only live via
# `wrangler tail`.
[observability]
enabled = true
# Workers Logs: the $5 plan includes 20M events a month, then bills. A quarter
# of invocations logged keeps even the plan's whole 10M requests (each a log
# and a line or two) far under it (guard.js).
head_sampling_rate = 0.25

# Every lap of an F1 session while it runs (f1-live.js: F1's archive has
# them only after the flag): a minute's look kept in a Durable Object. It
# moved here with the sports proxy (2026-10-13); the old Worker's log of past
# sessions wasn't carried (F1's archive has every finished session).
[[durable_objects.bindings]]
name = "F1_LOG"
class_name = "F1Log"

[[migrations]]
tag = "f1-log-main"
new_sqlite_classes = ["F1Log"]

# The door (door.js): who's using Orbit now, seats and a line when too many
# come at once; asked only when a session is handed out.
[[durable_objects.bindings]]
name = "DOOR"
class_name = "Door"

[[migrations]]
tag = "door-main"
new_sqlite_classes = ["Door"]

# The Runner (runner.js): the heavy routes and every cron's work, each a
# Durable Object request or alarm (30 s of CPU, 50 outside calls of its own,
# past them through its relays) where the Free plan gives a Worker's request
# 10 ms (2026-11-13 on).
[[durable_objects.bindings]]
name = "RUNNER"
class_name = "Runner"

[[migrations]]
tag = "runner-1"
new_sqlite_classes = ["Runner"]

# Two crons, the even minutes and the odd: every minute between them. New
# crons added on 2026-10-13 (F1's minute, the builders' hour, the guard's
# five) were registered and never run (a known fault of new crons that
# year), so F1's lap log runs on both and the builders on the even minute
# at :16 (worker.js scheduled).
[triggers]
crons = ["*/2 * * * *", "1-59/2 * * * *"]

# The bill's guard (quota-guard): woken every five minutes (its clock is a
# Durable Object's alarm; this only starts it again should it stop).
[[services]]
binding = "GUARD"
service = "quota-guard"
