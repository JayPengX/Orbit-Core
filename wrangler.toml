# Optional: only needed if you deploy this worker with the Wrangler CLI
# instead of the Cloudflare dashboard's online editor (see README, which
# documents both paths for each feature).
#
# CLI path:
#   npx wrangler login
#   npx wrangler deploy
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
#   npx wrangler kv namespace create RATE_LIMIT_KV
#     (then uncomment the [[kv_namespaces]] block below with the printed id)
#
# CI path (.github/workflows/deploy.yml deploys this file with Wrangler on
# every push to main that touches worker.js, locales/, or either wrangler
# file): a
# `wrangler deploy` pushes THIS FILE's [vars]/[[kv_namespaces]] as the
# worker's whole config, replacing whatever's live on Cloudflare - it does
# not merge with dashboard-made changes. Before ever relying on that
# workflow, fill in the real values below (FIREBASE_PROJECT_ID, and the
# kv_namespaces block if you use RATE_LIMIT_KV) to match what's already
# live, or the first automated deploy will overwrite them with the
# placeholders below. Secrets (GEMINI_API_KEY etc., set via `wrangler
# secret put` or the dashboard) are stored separately and are NOT touched
# by a plain `wrangler deploy` - only [vars] and bindings live here.
name = "orbit-workers-proxy"
# ^ Must match the Worker's actual name in the Cloudflare dashboard exactly -
# `wrangler deploy` targets whatever's named here, and a mismatch silently
# creates/updates an unrelated second Worker instead of erroring. This is
# the live Worker's name from before this code moved into its own repo,
# kept unchanged on purpose - not a sign this is still Orbit-specific.
main = "worker.js"
compatibility_date = "2025-01-01"

# Without this, Cloudflare runs each request's Worker isolate at whichever
# edge colo is nearest the calling browser, so /gemini's one outbound fetch
# (to generativelanguage.googleapis.com) also originates from that colo's
# egress IP. Some of Cloudflare's colos geolocate to countries/territories
# Google's Gemini API refuses outright ("User location is not supported for
# the API use", a plain 400 - see AIVisionProcessor.callGemini's handling of
# it in src/gemini-ocr.js), so a user whose traffic happens to route through
# one of those colos hits this error even though their own real location is
# fully supported.
#
# This used to be `mode = "smart"` instead, which asks Cloudflare to place
# the isolate near wherever the Worker's own subrequests actually go, based
# on observed traffic patterns - and for this app's actual traffic (heavily
# Taiwan-based), that consistently converged on Cloudflare's Hong Kong colo
# (confirmed via the X-Worker-Colo response header - see worker.js's
# corsHeaders): Hong Kong is one of Cloudflare's biggest Asia-Pacific hubs,
# so it's a very plausible "closest to Google's Asia-Pacific presence" pick -
# except Google's Gemini API is not available in Hong Kong or mainland China
# AT ALL, by explicit policy, not as one blocked colo among many. Smart
# Placement's latency-only heuristic has no way to know that, so it kept
# landing on the one colo guaranteed to fail every time, and a client-side
# retry against the same Worker deployment couldn't route around it either
# (retrying doesn't change which colo Smart Placement judges "optimal").
#
# `region` instead pins the target explicitly: Cloudflare runs the Worker in
# whichever of its own data centers has the lowest latency to the NAMED
# cloud region below, rather than empirically guessing from traffic.
# Available on every Workers plan; dashboard-only deploys only expose the
# "Smart" toggle, so Wrangler/CI (see the CLI path above) is what applies it.
#
# It was `gcp:us-east4` (Ashburn, Virginia), the region live-tested against
# Gemini. But this Worker is no longer mostly Gemini: Orbit Transit's TDX
# calls (several per plan, all to Taipei), Orbit Weather's CWA calls and the
# Quadra Pass all crossed the Pacific twice from there, and a slow TDX
# answer is what showed in Orbit Transit as "暫時無法取得資料". Now
# `gcp:asia-east1` (Changhua, Taiwan): it runs in Taipei (seen live:
# the response header `cf-placement: remote-TPE`; X-Worker-Colo is the colo
# the request came in through, not where the Worker ran). Taiwan is a Gemini-supported location; if a
# "User location is not supported" ever comes back, it's handled on the
# Gemini side (its own Worker or route), not by moving every app away.
[placement]
region = "gcp:asia-east1"

# Only needed for /sync and /vocab-sync (see worker.js's handleSyncRequest).
# Not a secret on its own - it's already public today in the no-proxy
# fallback path (VITE_ORBIT_SYNC_PROJECT_ID ships inside the client JS
# bundle) - kept as a plain var here so it's easy to see/change in the
# dashboard without needing "reveal secret".
[vars]
FIREBASE_PROJECT_ID = "orbit-project-76897"
# Orbit Transit (transit.js): TDX calls a minute this Worker allows itself.
# The owner is on a paid TDX plan (5 a second at least): 4 a second.
TDX_PER_MIN = "240"
# …and a second: calls wait their turn, 4 a second (TDX refuses past 5).
TDX_PER_SEC = "4"
# A local dev page (the preview's --live) may ask for transit data without a
# Quadra Pass, rate-limited (worker.js). "off" closes it.
TRANSIT_DEV = "on"
# The sports proxy's dev door (sports.js checkSession): a local
# page may read without a Quadra Pass, rate-limited. "off" closes it.
SPORTS_DEV = "on"
# The Pass's store (doc-store.js): "firestore", "dual" (Firestore the truth,
# every write copied to D1, the cron copying the rest), then "d1".
STORE_MODE = "dual"

# GEMINI_API_KEY (for /gemini, /nl-edit, /vocab-ai) and
# FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY (for /sync and /vocab-sync,
# from Firebase Console -> Project Settings -> Service accounts -> Generate
# new private key) are set as Secrets, not [vars] - see the CLI
# commands above, or the dashboard's Settings -> Variables and Secrets.
# Treat the Firebase service-account key like a password: it grants full
# read/write access to that Firebase project, bypassing Firestore Security
# Rules entirely (that's the whole point - see worker.js's /sync
# comment). Either feature works independently of the other being
# configured - see worker.js's top-of-file comment.

# Workers KV: what has to outlive an isolate and be seen by the crons:
# push subscriptions (push.js), Orbit Transit's monthly Google meter and TDX
# token (transit.js), Orbit Weather's daily Google count, its scoring and an
# hourly copy of each cell (weather.js, weather-skill.js). Not rate limits:
# those are in memory (worker.js), and caches are in Cloudflare's cache, so
# the free tier's 1,000 writes a day stay far off.

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b24d75fbe0a4a69aef0f35cb7a8d847"

# Keeps console.log output (e.g. worker.js's gemini_usage token counts) in
# the Cloudflare dashboard's Workers Logs, instead of only live via
# `wrangler tail`.
[observability]
enabled = true
# Workers Logs: the $5 plan includes 20M events a month, then bills. A quarter
# of invocations logged keeps even the plan's whole 10M requests (each a log
# and a line or two) far under it (guard.js).
head_sampling_rate = 0.25

# The $5 plan lets an invocation run 30 s of CPU, billed past 30M ms a month
# (the guard watches the month): the builders' runs (a night's season packs,
# a city's bus timetables) need seconds; a request uses milliseconds.
[limits]
cpu_ms = 30000

# /kambi cron (kambi.js): Kambi matches with open Quadra Play bets, every 2 minutes (one index read when nothing is on).
# The odd minutes: Quadra Play's slips settled (settle.js, worker.js SETTLE_CRON), an invocation of its own.
# Every lap of an F1 session while it runs (f1-live.js: F1's archive has
# them only after the flag): a minute's look kept in a Durable Object. It
# moved here with the sports proxy (2026-10-13); the old Worker's log of past
# sessions wasn't carried (F1's archive has every finished session).
[[durable_objects.bindings]]
name = "F1_LOG"
class_name = "F1Log"

[[migrations]]
tag = "f1-log-main"
new_sqlite_classes = ["F1Log"]

# Two crons, the even minutes and the odd: every minute between them. New
# crons added on 2026-10-13 (F1's minute, the builders' hour, the guard's
# five) were registered and never run (a known fault of new crons that
# year), so F1's lap log runs on both and the builders on the even minute
# at :16 (worker.js scheduled).
[triggers]
crons = ["*/2 * * * *", "1-59/2 * * * *"]

# The bill's guard (quota-guard): woken every ten minutes (its clock is a
# Durable Object's alarm; this only starts it again should it stop).
[[services]]
binding = "GUARD"
service = "quota-guard"
