# The Gemini relay (gemini-relay.js): Gemini called from Taiwan, for the
# proxy (its service binding GEMINI_RELAY). Deployed by deploy.yml before the
# proxy. No address of its own.
name = "gemini-relay"
main = "gemini-relay.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

# Taiwan (Changhua): a Gemini-supported location; Smart Placement once chose
# Hong Kong, which Gemini refuses.
[placement]
region = "gcp:asia-east1"

[limits]
cpu_ms = 1000

[observability]
enabled = true
